# にしおさんぽGO：歩く地図（1マス8m）を西尾市全体ぶん実際の地図データから作り直して、nishio-go/chunks/ をコミットする
name: Bake Nishio walking map
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'この区画だけ作る（例 "29_21,30_21"。見た目を確かめるとき）'
        required: false
        default: ''
  push:
    branches:
      - main
      - claude/confident-turing-etepui
    paths:
      - tools/bake-chunks.js
      - tools/gsi-buildings.js
      - tools/chunks-version.txt
      - nishio-go/region.js
      - .github/workflows/bake-chunks.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: bake-chunks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2 @mapbox/vector-tile@1.3.1 pbf@3.2.1 jpeg-js@0.4.4
          npx playwright install --with-deps chromium
      - name: Bake walking map chunks
        id: bake
        env:
          BAKE_ONLY: ${{ inputs.only }}
        run: node tools/bake-chunks.js
      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nishio-go/chunks
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "にしおさんぽGO: 歩く地図を実際の地図データから作り直し（自動）"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
      # 時間の上限で途中までだったときは、残りの区画を作るためにもう一度起動する（GITHUB_TOKEN のコミットでは push の起動がかからないため）
      - name: Continue with the remaining chunks
        if: steps.bake.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bake-chunks.yml --ref "${GITHUB_REF_NAME}"
