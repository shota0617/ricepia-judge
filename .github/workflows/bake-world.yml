# にしおさんぽGO：せかいちず（西尾市全体のドット絵マップ）を実際の地図データから作り直して、nishio-go/world.json をコミットする
name: Bake Nishio world map
on:
  workflow_dispatch:
  push:
    paths:
      - tools/bake-world.js
      - .github/workflows/bake-world.yml
      - tools/world-version.txt
permissions:
  contents: write
concurrency:
  group: bake-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Bake world map
        run: node tools/bake-world.js
      - uses: actions/upload-artifact@v4
        with:
          name: world-json
          path: nishio-go/world.json
      - name: Commit world.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nishio-go/world.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "にしおさんぽGO: せかいちずを実際の地図データから作り直し（自動）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
