# にしおさんぽGO：せかいちず（西尾市全体のドット絵マップ）を実際の地図データから作り直して、nishio-go/world.json をコミットする
name: Bake Nishio world map
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/confident-turing-etepui
    paths:
      - tools/bake-world.js
      - .github/workflows/bake-world.yml
      - tools/world-version.txt
permissions:
  contents: write
concurrency:
  group: bake-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Bake world map
        run: node tools/bake-world.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-json
          path: nishio-go/world.json
      - name: Commit world.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nishio-go/world.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "にしおさんぽGO: せかいちずを実際の地図データから作り直し（自動）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
