# らいすぴあ ミーティング：お客様の要望（Issue）を Claude Code が開発する
# - Issue に「claude-dev」ラベルが付くと、Claude が Issue の内容（受け入れ条件）に沿って実装し、ブランチに変更を積んで Issue に報告する
# - Issue やPRのコメントで「@claude …」と書くと、追加の指示・質問に答える
# 必要な準備：リポジトリの Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY、Claude GitHub App（https://github.com/apps/claude）のインストール
# 起動できるのは、このリポジトリに書き込み権限のある人（ラベル付け・コメント）だけ。できた変更の取り込み（マージ）は人が確認してから行う
#   コメントでの起動は、ここでも リポジトリの持ち主・メンバー・共同作業者の コメントだけに しぼる（公開リポジトリなので、だれでも コメントは書ける。アクションの中の確かめに たよりきらない）
name: Claude 開発（お客様の要望から）
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
concurrency:
  group: claude-dev-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  develop:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude-dev') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude-dev
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --append-system-prompt "Issue・PR・コミットメッセージへの書き込みは日本語で。Issue の「受け入れ条件」をすべて満たすように実装し、既存のコードの書き方に合わせて変更は必要な範囲にとどめる。前提が足りない点は推測で作らず Issue で質問する。お客様の個人情報をコードやコメントに書かない。"
