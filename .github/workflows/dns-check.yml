# 一時的：go.ricepia.jp の DNS と https を確かめる（ricepia.jp 本体が変わっていないことも）
name: DNS check
on:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - .github/workflows/dns-check.yml
permissions:
  contents: read
jobs:
  dig:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://ricepia.jp/ http://ricepia.jp/ https://www.ricepia.jp/ https://go.ricepia.jp/ https://go.ricepia.jp/nishio-go/ogp.png; do
            for t in 1; do printf '%-45s ' "$u"; curl -sS -o /dev/null --max-time 25 -w '%{http_code} %{size_download} %{remote_ip}\n' "$u" || echo; done
          done
