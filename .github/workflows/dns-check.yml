# 一時的：ricepia.jp の DNS（ネームサーバー・レコード）を調べる（自社ドメインで公開する準備）
name: DNS check
on:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - .github/workflows/dns-check.yml
permissions:
  contents: read
jobs:
  dig:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for q in "NS ricepia.jp" "SOA ricepia.jp" "A ricepia.jp" "A www.ricepia.jp" "CNAME www.ricepia.jp" "MX ricepia.jp" "A go.ricepia.jp" "CNAME go.ricepia.jp" "A game.ricepia.jp" "TXT ricepia.jp"; do
            echo "== $q"; dig +short $q
          done
          echo "== whois"; (sudo apt-get install -y -qq whois >/dev/null 2>&1 && whois ricepia.jp | grep -iE 'Name Server|Registrant|登録者|ネームサーバ|\[Status\]|Last Update' ) || true
