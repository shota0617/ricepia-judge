# にしおさんぽGO：プレイヤーのおたより（非公開リポジトリの Issue。api/feedback.js が置く）を30分ごとに仕分けて、直せるものは PR にする
# 1. 決まった手順で片づくもの（もうゲームにある名所・OpenStreetMap にある名所）は、その場で返事をして閉じる
# 2. のこりは Claude が読み、出典で確かめられた小さな直し（ふつうのスポットを足す・説明のまちがいを直す など）をする。
#    Claude は シェル・git・トークンを使えず、読み書きと決まったサイトの閲覧だけ。おたよりの文は「データ」として扱う（tools/feedback-prompt.md）
# 3. 直してよい場所の変更だけを、非公開の置き場の「公開前の確認」Issue に置く（公開のリポジトリには まだ出さない）。結果を Issue に書きもどす
#    人が中身を確かめて「Nishio feedback publish」（feedback-publish.yml）を動かしたときだけ PR になる（マージも人）
# 4. 受付番号ごとの返事と、人がマージして反映されたことを nishio-go/voices.json に書いて main にコミットする（ゲームの「こえ」タブで知らせる）
# 必要な準備：Variables の FEEDBACK_REPO、Secrets の FEEDBACK_TOKEN と ANTHROPIC_API_KEY（無いあいだは なにもしない／決まった手順だけ）。docs/feedback.md
name: Nishio feedback
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'   # 30分ごと（プレイヤーの声を早く返す。おたよりが無い回は数十秒で終わる）
permissions:
  contents: write   # voices.json を main にコミットするため（PR は feedback-publish.yml が作る）
concurrency:
  group: feedback
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
    steps:
      - name: Check settings
        id: cfg
        env:
          T: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          if [ -n "$T" ] && [ -n "$FEEDBACK_REPO" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "FEEDBACK_REPO / FEEDBACK_TOKEN が無いので、なにもしません"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cfg.outputs.on
        with:
          persist-credentials: false   # Claude が動くあいだ、git の認証情報を置かない（PR を作るときだけ渡す）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cfg.outputs.on
        with:
          node-version: 20
      # Claude が作業場所のファイルを書きかえても、トークンを使う手順は Claude より前の中身で動かす（作業場所の外にコピーしておく）
      - name: Keep trusted tools
        if: steps.cfg.outputs.on
        run: |
          mkdir -p "$RUNNER_TEMP/trusted/tools" "$RUNNER_TEMP/trusted/nishio-go"
          cp tools/feedback-triage.js tools/feedback-report.js tools/make-minna.js tools/feedback-prompt.md tools/feedback-report-prompt.md "$RUNNER_TEMP/trusted/tools/"
          cp nishio-go/osm-query.js "$RUNNER_TEMP/trusted/nishio-go/"
      - name: Sort feedback
        id: sort
        if: steps.cfg.outputs.on
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          CLAUDE_ON: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          FEEDBACK_ROOT: ${{ github.workspace }}
        run: |
          node "$RUNNER_TEMP/trusted/tools/feedback-triage.js" prepare
          n=$(node -e "console.log(require('./.feedback/items.json').length)")
          if [ "$n" -gt 0 ]; then echo "ai=1" >> "$GITHUB_OUTPUT"; fi
          # このあとの手順（転載の確かめ・Issue への返事・voices）が読む データの 正本は、作業場所の外に 置いておく（Claude の あとで もどす）
          mkdir -p "$RUNNER_TEMP/trusted/feedback"
          for f in items.json rids.json status.json; do if [ -f ".feedback/$f" ]; then cp ".feedback/$f" "$RUNNER_TEMP/trusted/feedback/"; fi; done
      # Claude：書けるのは nishio-go/ と .feedback/results.json だけ、読めるのは作業場所の中だけ。動かすあいだ .git は作業場所の外に置く
      - name: Claude reads feedback
        if: steps.sort.outputs.ai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.305 > /dev/null
          mv .git "$RUNNER_TEMP/dotgit"
          claude -p "$(cat "$RUNNER_TEMP/trusted/tools/feedback-prompt.md")" --model claude-opus-5-5 --max-turns 40 --permission-mode dontAsk \
            --allowedTools "Read(./**),Glob,Grep,Edit(./nishio-go/**),Write(./nishio-go/**),Edit(./nishio-go.html),Write(./.feedback/results.json),WebFetch(domain:ja.wikipedia.org),WebFetch(domain:www.wikidata.org),WebFetch(domain:www.city.nishio.aichi.jp),WebFetch(domain:www.openstreetmap.org),WebFetch(domain:nominatim.openstreetmap.org)" \
            --disallowedTools "Bash,WebSearch,NotebookEdit,Task" | tail -n 40 || true
          if [ -e .git ]; then echo "Claude の手順のあいだに .git ができたので、止めます"; rm -rf .git; mv "$RUNNER_TEMP/dotgit" .git; exit 1; fi
          mv "$RUNNER_TEMP/dotgit" .git
      # Claude が書いてよいのは results.json だけ。ほかの .feedback のファイルは 正本で 上書きし、あとの手順が 作る ファイルは 消しておく
      # （おたよりの文に まぎれた 指示で、転載の確かめ・返事・voices の もとが 書きかえられないように）
      - name: Restore trusted feedback data
        if: steps.sort.outputs.ai
        run: |
          rm -f .feedback/blocked.txt .feedback/pr-body.md
          for f in items.json rids.json status.json; do
            if [ -f "$RUNNER_TEMP/trusted/feedback/$f" ]; then cp "$RUNNER_TEMP/trusted/feedback/$f" ".feedback/$f"; else rm -f ".feedback/$f"; fi
          done
      - name: Hand to review (private)
        id: pr
        if: steps.sort.outputs.ai
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          FEEDBACK_ROOT: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/trusted/tools/feedback-triage.js" pr
      - name: Report to feedback issues
        if: always() && steps.sort.outputs.ai
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          REVIEW_URL: ${{ steps.pr.outputs.url }}
          FEEDBACK_ROOT: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/trusted/tools/feedback-triage.js" report
      - name: Tell players (voices.json)
        if: always() && steps.cfg.outputs.on
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_ROOT: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/trusted/tools/feedback-triage.js" voices
