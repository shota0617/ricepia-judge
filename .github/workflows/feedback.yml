# にしおさんぽGO：プレイヤーのおたより（非公開リポジトリの Issue。api/feedback.js が置く）を30分ごとに仕分けて、直せるものは PR にする
# 1. 決まった手順で片づくもの（もうゲームにある名所・OpenStreetMap にある名所）は、その場で返事をして閉じる
# 2. のこりは Claude が読み、出典で確かめられた小さな直し（ふつうのスポットを足す・説明のまちがいを直す など）をする。
#    Claude は シェル・git・トークンを使えず、読み書きと決まったサイトの閲覧だけ。おたよりの文は「データ」として扱う（tools/feedback-prompt.md）
# 3. 直してよい場所の変更だけを PR にする（マージは人が確かめてから）。結果を Issue に書きもどす
# 4. 受付番号ごとの返事と、人がマージして反映されたことを nishio-go/voices.json に書いて main にコミットする（ゲームの「こえ」タブで知らせる）
# 必要な準備：Variables の FEEDBACK_REPO、Secrets の FEEDBACK_TOKEN と ANTHROPIC_API_KEY（無いあいだは なにもしない／決まった手順だけ）。docs/feedback.md
name: Nishio feedback
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'   # 30分ごと（プレイヤーの声を早く返す。おたよりが無い回は数十秒で終わる）
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: feedback
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
    steps:
      - name: Check settings
        id: cfg
        env:
          T: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          if [ -n "$T" ] && [ -n "$FEEDBACK_REPO" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "FEEDBACK_REPO / FEEDBACK_TOKEN が無いので、なにもしません"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on
        with:
          persist-credentials: false   # Claude が動くあいだ、git の認証情報を置かない（PR を作るときだけ渡す）
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.on
        with:
          node-version: 20
      - name: Sort feedback
        if: steps.cfg.outputs.on
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          CLAUDE_ON: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          node tools/feedback-triage.js prepare
          n=$(node -e "console.log(require('./.feedback/items.json').length)")
          if [ "$n" -gt 0 ]; then echo "ai=1" >> "$GITHUB_OUTPUT"; fi
        id: sort
      - name: Claude reads feedback
        if: steps.sort.outputs.ai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.305 > /dev/null
          claude -p "$(cat tools/feedback-prompt.md)" --model claude-opus-5-5 --max-turns 40 --permission-mode dontAsk \
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch(domain:ja.wikipedia.org),WebFetch(domain:www.wikidata.org),WebFetch(domain:www.city.nishio.aichi.jp),WebFetch(domain:www.openstreetmap.org),WebFetch(domain:nominatim.openstreetmap.org)" \
            --disallowedTools "Bash,WebSearch,NotebookEdit,Task" | tail -n 40
      - name: Open PR
        id: pr
        if: steps.sort.outputs.ai
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/feedback-triage.js pr
      - name: Report to feedback issues
        if: always() && steps.sort.outputs.ai
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: node tools/feedback-triage.js report
      - name: Tell players (voices.json)
        if: always() && steps.cfg.outputs.on
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/feedback-triage.js voices
