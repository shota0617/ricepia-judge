# 一時的：西尾の名物の下調べ（市の資料と観光協会のページ）。main には入れない
name: Fetch meibutsu sources
on:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - tools/fetch-meibutsu.py
      - .github/workflows/fetch-meibutsu.yml
permissions:
  contents: write
concurrency:
  group: research-commit
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pypdf
      - run: python3 tools/fetch-meibutsu.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference
          git diff --cached --quiet && exit 0
          git commit -m "参考：西尾の名物（市の資料・観光協会）（一時的）"
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
