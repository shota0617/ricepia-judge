# 一時的：スポットを増やす下調べ（観光協会のスポットのページと OpenStreetMap）。main には入れない
name: Fetch spot sources
on:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - tools/fetch-spot-sources.py
      - .github/workflows/fetch-spot-sources.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch-spot-sources.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference
          git diff --cached --quiet && exit 0
          git commit -m "参考：観光協会のスポットと OpenStreetMap の名前つきの場所（一時的）"
          git push origin HEAD:${GITHUB_REF_NAME}
