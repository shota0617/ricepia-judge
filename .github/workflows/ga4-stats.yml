# にしおさんぽGO：累計プレイ人数を Google アナリティクスから数えて nishio-go/stats.json をコミットする（毎日）。
# Secrets の GA4_PROPERTY_ID と GA4_SERVICE_ACCOUNT_JSON が無いあいだは、何もしない（docs/ads-game-kit.md）
name: Count Nishio players
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'   # 毎日 0:23（日本時間）
permissions:
  contents: write
concurrency:
  group: ga4-stats
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count players
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node tools/ga4-stats.js
      - name: Commit stats.json
        run: |
          [ -f nishio-go/stats.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nishio-go/stats.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "にしおさんぽGO: 累計プレイ人数を更新（自動）"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
