# 一時的：住所を座標にする（スポットを増やす下調べ）。main には入れない
name: Geocode spots
on:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - tools/geocode-gsi.py
      - .github/workflows/geocode-gsi.yml
permissions:
  contents: write
concurrency:
  group: research-commit
  cancel-in-progress: false
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/geocode-gsi.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference
          git diff --cached --quiet && exit 0
          git commit -m "参考：住所の座標（国土地理院の住所検索・一時的）"
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
