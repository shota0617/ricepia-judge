# らいすぴあ Google広告：tools/google-ads-*.js（Google広告スクリプト）を、Google Ads API から動かす（tools/google-ads-run.js）。
# 手で動かすだけ。apply を true にしないかぎり「検証だけ」（validateOnly）で、アカウントは変わらない。main からだけ動く（Environment で しばる）。
#   job: game-campaign（にしおさんぽGO 専用キャンペーンを一時停止で作る）／ game（サイトリンク・コールアウト）
# Secrets：GitHub の Environment「google-ads」（動かせるブランチを main だけにする）の Environment secrets に入れる。
#          リポジトリの Secrets に入れると、main 以外のブランチで書きかえた コードにも 本番の 認証情報が わたってしまう（Codex の 指摘）
#          GOOGLE_ADS_DEVELOPER_TOKEN・GOOGLE_ADS_CLIENT_ID・GOOGLE_ADS_CLIENT_SECRET・GOOGLE_ADS_REFRESH_TOKEN・GOOGLE_ADS_CUSTOMER_ID
#          （MCC 経由のときだけ GOOGLE_ADS_LOGIN_CUSTOMER_ID）。くわしくは docs/ads-game-kit.md の 3-3
name: Google Ads
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'どのスクリプト（game-campaign / game）'
        required: true
        default: game-campaign
        type: choice
        options: [game-campaign, game]
      apply:
        description: 'true でアカウントに反映。false は検証だけ（どちらも main からだけ）'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
permissions:
  contents: read
concurrency:
  group: google-ads
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets は この Environment に だけ 置く。Environment の「Deployment branches」を main だけに すると、
    # ほかの ブランチから 動かしても GitHub が ジョブを 止め、Secrets は わたらない（ワークフローを 書きかえても 同じ）
    environment: google-ads
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      JOB: ${{ inputs.job }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Run Google Ads script
        run: |
          for v in GOOGLE_ADS_DEVELOPER_TOKEN GOOGLE_ADS_CLIENT_ID GOOGLE_ADS_CLIENT_SECRET GOOGLE_ADS_REFRESH_TOKEN GOOGLE_ADS_CUSTOMER_ID; do
            [ -n "${!v}" ] || { echo "::error::Environment「google-ads」の Secrets に $v がありません（docs/ads-game-kit.md の 3-3）"; exit 1; }
          done
          # 公開の ログに お客様ID を 出さない（スクリプトは ハイフンなしで 書くので、両方 かくす）
          echo "::add-mask::$GOOGLE_ADS_CUSTOMER_ID"
          echo "::add-mask::${GOOGLE_ADS_CUSTOMER_ID//-/}"
          if [ "$APPLY" = "true" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::反映は main からだけ動かせます"; exit 1; }
            node tools/google-ads-run.js --job "$JOB" --apply
          else
            node tools/google-ads-run.js --job "$JOB"
          fi
