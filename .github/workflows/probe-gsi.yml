# 国土地理院の建物と空中写真の取れ方を確かめる（一時的。使い終わったら消す）
name: Probe GSI
on:
  workflow_dispatch:
  push:
    branches:
      - claude/confident-turing-etepui
    paths:
      - tools/probe-gsi.js
      - .github/workflows/probe-gsi.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock @mapbox/vector-tile@1.3.1 pbf@3.2.1 jpeg-js@0.4.4
      - run: node tools/probe-gsi.js
