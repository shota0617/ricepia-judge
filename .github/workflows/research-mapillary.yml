# 調査用：名所とお店を道から見た写真を Mapillary から集める（ドット絵の参考）。動かしたブランチの reference/ にコミットする
# 手で動かすだけ（Actions の「Run workflow」で、作業中のブランチをえらぶ）。写真は絵を描いたら消し、main には入れない
# シークレット MAPILLARY_TOKEN（Mapillary の Client Token）がないときは何もしない
name: Research Mapillary photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.ref_name != github.event.repository.default_branch   # main には写真をコミットしない
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node tools/mapillary-probe.js
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - name: 画像を小さくする（幅640）
        run: |
          [ -d reference/mapillary ] || exit 0
          command -v mogrify >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          mogrify -resize 640x -quality 72 -strip reference/mapillary/*.jpg 2>/dev/null || true
      - run: |
          [ -f reference/mapillary.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/mapillary reference/mapillary.json; git commit -q -m "調査：名所とお店の路上写真（Mapillary）（自動）" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
