# 調査（一時的）：本店（米津町）のあたりの市町の境界。結果を reference/region-probe.txt にコミットする
name: Research region boundary
on:
  workflow_dispatch:
  push:
    branches: [claude/confident-turing-etepui]
    paths: [.github/workflows/research-region.yml, reference/region-probe.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node reference/region-probe.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/region-probe.txt; git commit -q -m "調査：本店のあたりの市町の境界（自動）" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
