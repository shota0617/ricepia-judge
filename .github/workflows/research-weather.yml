# 一時的な調査：気象庁の防災情報 JSON（予報・アメダス）がブラウザから読めるか（CORS）と中身の形を reference/ にコミットする（マージ前に消す）
name: Research JMA weather
on:
  push:
    branches: [claude/confident-turing-etepui]
    paths: [.github/workflows/research-weather.yml]
permissions:
  contents: write
concurrency:
  group: research-commit
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p reference; out=reference/weather-probe.txt; : > $out
          for u in https://www.jma.go.jp/bosai/forecast/data/forecast/230000.json https://www.jma.go.jp/bosai/amedas/data/latest_time.txt https://www.jma.go.jp/bosai/amedas/const/amedastable.json https://www.jma.go.jp/bosai/common/const/area.json; do
            echo "== HEAD $u" >> $out; curl -sSI -m 30 -H "Origin: https://go.ricepia.jp" "$u" | grep -iE "^(HTTP|access-control|content-type|cache-control|content-length)" >> $out
          done
          echo "== forecast 230000 (head)" >> $out; curl -sS -m 30 https://www.jma.go.jp/bosai/forecast/data/forecast/230000.json | head -c 2500 >> $out; echo >> $out
          t=$(curl -sS -m 30 https://www.jma.go.jp/bosai/amedas/data/latest_time.txt); echo "== latest $t" >> $out
          k=$(date -d "$t" +%Y%m%d%H%M%S 2>/dev/null); echo "== key $k" >> $out
          curl -sSI -m 30 -H "Origin: https://go.ricepia.jp" "https://www.jma.go.jp/bosai/amedas/data/map/${k}.json" | grep -iE "^(HTTP|access-control)" >> $out
          curl -sS -m 30 https://www.jma.go.jp/bosai/amedas/const/amedastable.json > t.json
          python3 - >> $out <<'PY'
          import json,math
          t=json.load(open('t.json'))
          def ll(v): return v[0]+v[1]/60
          for k,v in t.items():
            la,lo=ll(v['lat']),ll(v['lon'])
            if 34.6<la<35.15 and 136.85<lo<137.5: print(k,v.get('kjName'),v.get('type'),round(la,4),round(lo,4),v.get('elems'))
          PY
          curl -sS -m 30 "https://www.jma.go.jp/bosai/amedas/data/map/${k}.json" > m.json
          python3 - >> $out <<'PY'
          import json
          m=json.load(open('m.json'))
          for k in list(m)[:1]: print('sample',k,m[k])
          for k in ['51106','51216','51331','51336','51281','51196']:
            print(k, m.get(k))
          PY
          echo "== area.json class20 for 西尾/岡崎/安城/碧南/幸田/蒲郡/高浜" >> $out
          curl -sS -m 30 https://www.jma.go.jp/bosai/common/const/area.json > a.json
          python3 - >> $out <<'PY'
          import json
          a=json.load(open('a.json'))
          for k,v in a.get('class20s',{}).items():
            if v['name'] in ('西尾市','岡崎市','安城市','碧南市','幸田町','蒲郡市','高浜市'): print(k,v['name'],v.get('parent'))
          for k,v in a.get('class15s',{}).items():
            if k.startswith('2300') or k.startswith('2301') or k.startswith('2302'): print('c15',k,v['name'],v.get('parent'))
          for k,v in a.get('class10s',{}).items():
            if k.startswith('230'): print('c10',k,v['name'],v.get('parent'))
          PY
      - name: Probe map file time zone
        run: |
          out=reference/weather-probe.txt
          t=$(curl -sS -m 30 https://www.jma.go.jp/bosai/amedas/data/latest_time.txt); echo "== tz check latest $t" >> $out
          jst=$(echo "$t" | sed -E 's/^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2}).*/\1\2\3\4\5\6/')
          utc=$(TZ=UTC date -d "$t" +%Y%m%d%H%M%S)
          for k in $jst $utc; do
            code=$(curl -s -o m.json -w '%{http_code}' -m 30 "https://www.jma.go.jp/bosai/amedas/data/map/${k}.json")
            echo "== key $k HTTP $code okazaki: $(python3 -c "import json;print(json.load(open('m.json')).get('51226',{}).get('temp'))" 2>/dev/null)" >> $out
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/weather-probe.txt; git commit -q -m "調査：気象庁の天気 JSON（自動）" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
