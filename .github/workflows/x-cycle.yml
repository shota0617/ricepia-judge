# X の発信から ゲームを直すサイクル：Grok が X でさがす → Claude が実装する → Codex がレビューする → Claude が直す（2回まで）→ PR
# 1. Grok（xAI の x_search）が、農家さんや西尾の人の X の発信から、ゲームに取り入れられそうな話をさがす（tools/x-cycle-topics.json）
#    API のクレジットが無いときは、無料の Grok に手で聞いた答えを「Grok の答え」にはりつけて動かす（毎週の分は、クレジットがあるときだけ動く）
# 2. Claude Code が 1〜3 つ選んで実装する。Claude は シェル・git・ウェブを使えず、決まったファイルの読み書きと 文法の確かめ（x-cycle.js check）だけ。発信は「データ」として扱う（tools/x-cycle-prompt.md）
# 3. Codex（openai/codex-action・読むだけ）がレビューし、must の指摘があれば Claude が直して、もう一度レビュー（2回まで）
# 4. 変えてよい場所の変更だけを PR にする（tools/x-cycle.js guard）。マージは人が遊んで確かめてから
# 必要な準備：Secrets の XAI_API_KEY（無料の Grok の答えをはりつけるなら不要）と、ANTHROPIC_API_KEY または CLAUDE_CODE_OAUTH_TOKEN（Claude の Pro・Max の契約で動かすとき。claude setup-token で作る）。無いあいだは なにもしない。OPENAI_API_KEY（無ければレビューなしで PR）。
#            Variables の XAI_MODEL・CODEX_MODEL で モデルを変えられる。くわしくは docs/x-cycle.md
name: X cycle (Grok → Claude → Codex)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どれを直すか（ゲーム・marketing＝今週の投稿案と企画。空なら週ごとに交代）'
        type: choice
        options: ['', tractor, nishio-go, marketing]
        default: ''
      research:
        description: 'Grok の答え（無料の Grok に聞いた1行の JSON をはりつける。あれば Grok の API は使わない。docs/x-cycle.md）'
        required: false
      focus:
        description: '今回とくにさがすこと（例：代かきの水の深さ・秋起こし）'
        required: false
      days:
        description: 'さかのぼる日数'
        default: '14'
  schedule:
    - cron: '23 22 * * 0'   # 毎週月曜 7:23（日本時間）。ゲームは週ごとに交代
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: x-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      XCYCLE_ROOT: ${{ github.workspace }}
      CODEX_ON: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Check settings
        id: cfg
        env:
          X: ${{ secrets.XAI_API_KEY }}
          R: ${{ inputs.research }}
          A: ${{ secrets.ANTHROPIC_API_KEY }}${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$A" ]; then echo "ANTHROPIC_API_KEY か CLAUDE_CODE_OAUTH_TOKEN が無いので、なにもしません"
          elif [ -z "$X" ] && [ -z "$R" ]; then echo "Grok の答えのはりつけも XAI_API_KEY も無いので、なにもしません"
          else echo "on=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cfg.outputs.on
        with:
          persist-credentials: false   # Claude と Codex が動くあいだ、git の認証情報を置かない（PR を作るときだけ渡す）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cfg.outputs.on
        with:
          node-version: 22   # Claude Code は Node 22 以上
      # Claude が作業場所のファイルを書きかえても、確かめる手順・PR を作る手順は Claude より前の中身で動かす（作業場所の外にコピーしておく）
      - name: Keep trusted tools
        if: steps.cfg.outputs.on
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          cp tools/x-cycle.js tools/x-cycle-topics.json tools/x-cycle*.md tools/x-cycle-review-schema.json "$RUNNER_TEMP/trusted/"
          npm i -g --prefix "$RUNNER_TEMP/cc" @anthropic-ai/claude-code@2.1.305 > /dev/null
          echo "CLAUDE_BIN=$RUNNER_TEMP/cc/bin/claude" >> "$GITHUB_ENV"

      # 1. Grok が X でさがす
      - name: Grok searches X
        id: research
        if: steps.cfg.outputs.on
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          TARGET: ${{ inputs.target }}
          RESEARCH: ${{ inputs.research }}
          FOCUS: ${{ inputs.focus }}
          DAYS: ${{ inputs.days }}
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" research

      # 2. Claude が実装する
      - name: Claude implements
        if: steps.research.outputs.items > 0
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" claude 0
      - name: Guard (0)
        id: guard0
        if: steps.research.outputs.items > 0
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" guard && node "$RUNNER_TEMP/trusted/x-cycle.js" review-prompt 1

      # 3. Codex がレビューする → must があれば Claude が直す（2回まで）
      - name: Codex review (1)
        id: review1
        if: steps.guard0.outputs.changed && env.CODEX_ON == 'true'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .xcycle/review-prompt-1.md
          output-file: .xcycle/review-1.json
          output-schema-file: ${{ runner.temp }}/trusted/x-cycle-review-schema.json
          permission-profile: ':read-only'
          model: ${{ vars.CODEX_MODEL }}
      - name: Verdict (1)
        id: verdict1
        if: steps.review1.outcome == 'success'
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" verdict 1
      - name: Claude fixes (1)
        if: steps.verdict1.outputs.fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" claude 1
      - name: Guard (1)
        id: guard1
        if: steps.verdict1.outputs.fix
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" guard && node "$RUNNER_TEMP/trusted/x-cycle.js" review-prompt 2
      - name: Codex review (2)
        id: review2
        if: steps.guard1.outputs.changed
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .xcycle/review-prompt-2.md
          output-file: .xcycle/review-2.json
          output-schema-file: ${{ runner.temp }}/trusted/x-cycle-review-schema.json
          permission-profile: ':read-only'
          model: ${{ vars.CODEX_MODEL }}
      - name: Verdict (2)
        id: verdict2
        if: steps.review2.outcome == 'success'
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" verdict 2
      - name: Claude fixes (2)
        if: steps.verdict2.outputs.fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" claude 2
      - name: Guard (2)
        id: guard2
        if: steps.verdict2.outputs.fix
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" guard && node "$RUNNER_TEMP/trusted/x-cycle.js" review-prompt 3
      - name: Codex review (3)
        id: review3
        if: steps.guard2.outputs.changed
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .xcycle/review-prompt-3.md
          output-file: .xcycle/review-3.json
          output-schema-file: ${{ runner.temp }}/trusted/x-cycle-review-schema.json
          permission-profile: ':read-only'
          model: ${{ vars.CODEX_MODEL }}
      - name: Verdict (3)
        if: steps.review3.outcome == 'success'
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" verdict 3

      # 4. PR にする（最後のレビューに must がのこっていたら、タイトルと本文で知らせる）
      - name: Open PR
        id: pr
        if: steps.guard0.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/x-cycle.js" pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.cfg.outputs.on
        with:
          name: x-cycle
          path: .xcycle/
          include-hidden-files: true
          retention-days: 14
