<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>亜糊粉層を残せ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 縦一枚。上に夜明け前の精米場（精米機の出口と分銅の腕）、下に親方の言葉・計器・操作パネル。
   単一の世界観（裸電球と糠の匂いがする小屋）。テーマ切り替えはせず、色はすべて明示する。 */
:root{
  --bg:#16120d;        /* 煤けた板壁 */
  --bg2:#1d1811;
  --panel:#231c14;
  --line:#3b3023;
  --fg:#ede5d3;        /* 精白米の生成り */
  --muted:#a29479;
  --brass:#cfa54e;     /* 分銅の真鍮 */
  --brass-dim:#8f7134;
  --nuka:#9a6a3a;      /* 糠・玄米 */
  --chalk:#dfe7ee;     /* 削りすぎの白 */
  --good:#a9c27f;      /* ちょうど */
  --bad:#d56b4b;
  --paper:#e3d6b6;     /* 伝票 */
  --ink:#2b2216;
  --f-serif:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-ui:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --f-dot:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid #221b13}

/* scene */
#scene{position:relative;flex:none;height:clamp(220px,42dvh,380px);overflow:hidden;background:#2a2a22}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:8px 14px;font:12px/1.2 var(--f-dot);letter-spacing:.06em;color:#efe6d0;text-shadow:0 1px 2px #000;pointer-events:none}
.hudr{display:flex;align-items:center;gap:10px}
.snd{pointer-events:auto;font:12px/1 var(--f-dot);letter-spacing:.06em;color:#efe6d0;background:rgba(22,18,13,.65);border:1px solid rgba(239,230,208,.35);border-radius:3px;padding:5px 8px}
.snd[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.hud .lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5a4a33;margin-right:6px;vertical-align:1px}
.hud .lamp.on{background:var(--good);box-shadow:0 0 6px var(--good)}
.fade{position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
#stamp{position:absolute;right:9%;top:30%;padding:0 12px;border:3px solid var(--bad);color:var(--bad);font:900 34px/1.25 var(--f-serif);letter-spacing:.12em;opacity:0;transform:rotate(-8deg);background:rgba(22,18,13,.6);pointer-events:none;white-space:nowrap}
#stamp.good{border-color:var(--good);color:var(--good)}
#stamp.on{animation:stamp 1.3s ease-out}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.2)}18%{opacity:1;transform:rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-8deg) scale(1)}}

/* dialog */
#dialog{position:relative;flex:none;min-height:84px;max-height:128px;overflow-y:auto;padding:2px 16px 10px}
.who{font:700 11px/1 var(--f-ui);letter-spacing:.3em;color:var(--brass);margin-bottom:5px;min-height:11px}
.said{font:500 16px/1.75 var(--f-serif);text-wrap:pretty;margin:0}
.said.narr{font-size:14.5px;color:#c4b89e}
.note{margin-top:6px;padding-left:9px;border-left:2px solid var(--brass-dim);font-size:12.5px;color:var(--brass)}

/* meters */
#meters{flex:none;display:grid;grid-template-columns:1.3fr 1fr auto;gap:14px;align-items:end;padding:8px 16px 9px;background:var(--bg2);border-block:1px solid var(--line)}
.mh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.mh b{font:400 13px var(--f-dot);letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;height:6px;margin-top:4px;background:#2a2219}
.fill{height:100%;width:0;background:var(--brass);transition:width .4s linear}
.chances{display:flex;gap:5px;margin-top:5px}
.chances i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--brass);display:block}
.chances i.used{border-color:#4d3f2c;background:#2a2219}
.chances i.left{background:var(--brass)}
.clock{text-align:right;line-height:1.2}
.clock .dot{font:400 17px var(--f-dot);color:var(--fg);font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}

/* tabs */
#tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg)}
#tabs button{height:44px;background:none;border:0;border-bottom:2px solid var(--line);color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.14em}
#tabs button[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}
#tabs button:disabled{opacity:.35;cursor:default}
#tabs .dotbadge::after{content:"";display:inline-block;width:6px;height:6px;margin-left:5px;border-radius:50%;background:var(--brass);vertical-align:middle}

/* panel */
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.h3{font:700 12px/1.4 var(--f-ui);letter-spacing:.22em;color:var(--muted);margin:0 0 8px}
.lead{font-size:13px;color:#cfc3a8;margin:0 0 10px;text-wrap:pretty}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--brass);background:var(--brass);color:#22190d;font-weight:700;font-size:15px;letter-spacing:.16em;border-radius:3px}
.btn.ghost{background:transparent;color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* slip (伝票) */
.slip{background:var(--paper);color:var(--ink);padding:14px 16px 12px;border-radius:2px;box-shadow:0 2px 0 #9c8d6a,0 8px 18px rgba(0,0,0,.45);position:relative}
.slip::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:radial-gradient(circle at 6px 6px,transparent 4px,var(--paper) 4.5px) 0 0/12px 6px repeat-x}
.slip .shop{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;color:#6d5d40;border-bottom:1px dashed #a8976f;padding-bottom:6px;margin-bottom:8px}
.slip h2{font:900 21px/1.35 var(--f-serif);margin:0;text-wrap:balance}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13px}
.slip dt{color:#6d5d40;letter-spacing:.1em}
.slip dd{margin:0;font-weight:500}
.slip .memo{margin-top:10px;padding-top:8px;border-top:1px dashed #a8976f;font:500 13.5px/1.7 var(--f-serif)}
.soft{display:inline-flex;gap:3px;vertical-align:-1px}
.soft i{width:9px;height:9px;border-radius:50%;border:1px solid #6d5d40;display:block}
.soft i.on{background:#6d5d40}

/* look */
.tray{position:relative;border-radius:4px;overflow:hidden;background:#2b2015;border:1px solid var(--line)}
.tray canvas{display:block;width:100%;height:130px}
.tray .cap{position:absolute;left:10px;bottom:6px;font-size:11px;color:#bba98a;letter-spacing:.12em;text-shadow:0 1px 2px #000}
.xsec{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.xsec svg{width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px}
.legend s{text-decoration:none;flex:none;width:12px;height:12px;border-radius:2px;display:block}
.legend b{margin-left:auto;font:400 12px var(--f-dot);font-variant-numeric:tabular-nums}
.nukabox{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.nukabox .pile{display:block;width:52px;height:34px;border-radius:50% 50% 46% 46%/70% 70% 30% 30%;box-shadow:0 3px 0 #120e09}
.nukabox>div{min-width:0}
.impress{font:500 15px/1.75 var(--f-serif);margin:0;padding:10px 12px;background:var(--panel);border-left:2px solid var(--brass-dim)}

/* touch */
.touchpad{position:relative;height:150px;border-radius:4px;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 120%,#3a2b1b,#1f1810 70%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.touchpad canvas{position:absolute;inset:0;width:100%;height:100%}
.touchpad .hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:2px 10px;border-radius:10px;background:rgba(22,18,13,.8);white-space:nowrap;font-size:12px;color:#d8c8a6;letter-spacing:.12em;pointer-events:none}
.scale{margin-top:2px}
.scale .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.08em}
.scale .track{position:relative;height:10px;margin:4px 0 2px;border-radius:5px}
.scale .mark{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;background:var(--fg);border-radius:2px;box-shadow:0 0 0 2px var(--bg);transition:left .6s ease}
.scale .mark.fuzzy{width:26px;margin-left:-13px;background:rgba(237,229,211,.35);box-shadow:none}
.tex{background:linear-gradient(90deg,#9a6a3a,#c9a873 30%,#d9d0b4 50%,#c8cdd0 72%,#dfe7ee)}
.temp{background:linear-gradient(90deg,#55606a,#8a7a5c 40%,#c98b45 70%,#d56b4b)}

/* weights */
.rig{display:flex;flex-wrap:wrap;gap:8px}
.wt{position:relative;flex:1 1 0;min-width:56px;padding:10px 4px 8px;border:1px solid var(--line);background:var(--panel);border-radius:3px;text-align:center}
.wt .w{display:block;margin:0 auto 6px;border-radius:4px;background:linear-gradient(180deg,#8d9392,#eef0ef 22%,#c3c8c6 50%,#7d8382);box-shadow:inset -6px 0 0 rgba(0,0,0,.18)}
.wt span{display:block;font:400 13px var(--f-dot)}
.wt small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.wt[aria-pressed="false"] .w{background:#2c241a;box-shadow:inset 0 0 0 1px #4a3c2a}
.wt[aria-pressed="false"] span{color:var(--muted)}
.wt[aria-pressed="true"]{border-color:var(--brass)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 2px;border-top:1px solid var(--line)}
.total b{font:400 28px var(--f-dot);color:var(--brass);font-variant-numeric:tabular-nums}
.total small{font-size:12px;color:var(--muted)}
.notch{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.notch .btn{font-size:14px;letter-spacing:.08em}
.nv{text-align:center;min-width:72px}
.nv small{display:block;font-size:11px;color:var(--muted);letter-spacing:.2em}
.nv b{font:400 30px/1.1 var(--f-dot);color:var(--brass);font-variant-numeric:tabular-nums}

/* results */
.seglist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.seglist li{display:grid;grid-template-columns:20px 64px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;background:var(--panel);border-radius:3px}
.seglist .g{height:14px;border-radius:7px}
.seglist .k{font:400 12px var(--f-dot);color:var(--muted);font-variant-numeric:tabular-nums}
.verdict{font-weight:700;letter-spacing:.06em;white-space:nowrap}
.voice{margin:0;padding:10px 12px;background:var(--paper);color:var(--ink);font:500 14.5px/1.7 var(--f-serif);border-radius:2px}
.voice small{display:block;font:700 11px/1.4 var(--f-ui);letter-spacing:.14em;color:#6d5d40}
.rank{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.rank .big{font:900 44px/1 var(--f-serif);color:var(--brass);min-width:70px;text-align:center}
.rank p{margin:0;font:500 14px/1.7 var(--f-serif)}
.rank small{display:block;color:var(--muted);font:12px var(--f-ui);letter-spacing:.08em}
.bowl{border:1px solid var(--line);background:radial-gradient(ellipse at 50% 30%,#3a2d1e,#18130d 75%);border-radius:3px;overflow:hidden}
.bowl canvas{display:block;width:100%;height:170px}
.bags{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bags div{padding:8px;text-align:center;background:var(--panel);border:1px solid var(--line)}
.bags b{display:block;font:900 24px/1.2 var(--f-serif);color:var(--brass)}
.bags small{display:block;font-size:11px;color:var(--muted);line-height:1.4}

/* title */
.title{padding-top:4px}
.title h1{font:900 34px/1.2 var(--f-serif);margin:0;letter-spacing:.06em;text-wrap:balance}
.title .sub{font-size:11px;letter-spacing:.3em;color:var(--brass);margin:0 0 6px}
.rules{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13px;line-height:1.65}
.rules li b{font-size:11px;letter-spacing:.14em;color:var(--brass);padding-top:2px}
.layers{display:flex;height:16px;margin:4px 0 2px;border-radius:2px;overflow:hidden}
.layers span{display:block;height:100%}
.log ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:12.5px;padding:5px 8px;background:var(--panel)}
.log li span:nth-child(2){color:var(--muted)}
.log li b{font:400 13px var(--f-dot);font-variant-numeric:tabular-nums}
.best{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-height:700px){
  #scene{height:clamp(190px,36dvh,300px)}
  #dialog{min-height:72px}
}
@media (prefers-reduced-motion:reduce){
  #stamp.on{animation:none;opacity:1}
  .fill,.scale .mark{transition:none}
}
</style>

<div id="app">
  <div id="scene">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="hud"><span><i class="lamp" id="lamp"></i><span id="hudL">近藤米穀店 精米場</span></span><span class="hudr"><span id="hudR">5:30</span><button id="bSound" class="snd" aria-pressed="false">音 切</button></span></div>
    <div id="stamp"></div>
    <div class="fade"></div>
  </div>
  <div id="dialog" aria-live="polite">
    <div class="who" id="who"></div>
    <p class="said" id="said"></p>
    <div class="note" id="note" hidden></div>
  </div>
  <div id="meters">
    <div>
      <div class="mh">袋の進み<b id="mKg">0 / 10kg</b></div>
      <div class="bar"><div class="fill" id="fKg"></div></div>
    </div>
    <div>
      <div class="mh">分銅<b id="mW">4.0kg</b></div>
      <div class="chances" id="chances" aria-label="分銅を掛け替えられる残り回数"></div>
    </div>
    <div class="clock"><span class="dot" id="clock">5:30</span><small id="bagNo">第1袋 / 3袋</small></div>
  </div>
  <div id="tabs" role="tablist">
    <button role="tab" id="tLook" data-tab="look">見る</button>
    <button role="tab" id="tTouch" data-tab="touch">触る</button>
    <button role="tab" id="tWeight" data-tab="weight">分銅</button>
    <button role="tab" id="tSlip" data-tab="slip">伝票</button>
  </div>
  <div id="panel"></div>
</div>

<script>
'use strict';
/* =========================================================
   品種：近藤米穀店 らいすぴあ（ricepia.jp）で扱う白米の品種。
   nuka = ぬか層のやわらかさ（1:かため 〜 5:とてもやわらかい）
   ease = 分銅1kgあたりの削れやすさ倍率（ゲーム用の値。店の実感に合わせて調整してよい）
   look = 見た目のクセ。＋だと実際より白く見える（白濁・白さが際立つ品種）
   ========================================================= */
const VARIETIES = [
  {name:'姫さま', sub:'山形・減農薬つや姫', nuka:4, ease:1.08, look:0,
   memo:'艶が命の米。ぬか層はややもやわらかい。白くしすぎると艶が消える。'},
  {name:'幻の米', sub:'JAながの・コシヒカリ限定', nuka:2, ease:0.94, look:0,
   memo:'寒暖差で締まった粒。ぬか層はやや硬め、重めに掛けないと黒が残る。'},
  {name:'富山コシヒカリ', sub:'富山県産', nuka:3, ease:1.00, look:0,
   memo:'いちばん素直に削れる、うちの基準の米。'},
  {name:'雪若丸', sub:'山形県産', nuka:2, ease:0.90, look:4,
   memo:'粒がしっかりしてぬか層は硬め。もともと白さが際立つから、目だけで見ると白く見える。'},
  {name:'夢しずく', sub:'佐賀県産', nuka:4, ease:1.05, look:0,
   memo:'ぬか層ややもやわらか。軽めの分銅でもよく落ちる。'},
  {name:'ひとめぼれ', sub:'岩手県産', nuka:3, ease:1.02, look:0,
   memo:'粘りと甘みの釣り合いがいい。ぬか層はふつう。'},
  {name:'ミルキークイーン', sub:'低アミロース米', nuka:5, ease:1.16, look:7,
   memo:'ぬかがすぐ落ちるもっちり米。粒が白く濁っているから、目で見ると実際より白い。手で確かめろ。'},
  {name:'減農薬コシヒカリ', sub:'愛知県産', nuka:3, ease:1.00, look:0,
   memo:'素直なコシヒカリ。基準どおりに掛ければいい。'},
  {name:'ハツシモ', sub:'安城産', nuka:1, ease:0.87, look:0,
   memo:'大粒で硬質な晩生。ぬか層が硬く、なかなか落ちない。'},
  {name:'のどか', sub:'愛知コシヒカリ', nuka:3, ease:1.03, look:0,
   memo:'地元のコシヒカリ。ぬか層はふつう。'},
  {name:'あいちのかおり', sub:'愛知県産', nuka:2, ease:0.94, look:0,
   memo:'大粒であっさり。ぬか層はやや硬め。'},
  {name:'にこまる', sub:'西尾産', nuka:2, ease:0.92, look:0,
   memo:'粒に厚みがあって、ぬか層はやや硬め。'},
];
const CONDS = [
  {name:'新米', f:1.04, memo:'水分が多く、ぬかが落ちやすい'},
  {name:'ふつう', f:1.00, memo:''},
  {name:'少し乾き気味', f:0.95, memo:'乾いてぬかが締まっている'},
];
const CUSTOMERS = [
  {who:'駅前の定食屋さん', want:'毎日の白ごはん用。'},
  {who:'おにぎり屋さん', want:'冷めてもうまい米で。'},
  {who:'常連の奥さん', want:'家族が多いから、いつもの味で。'},
  {who:'仕出し弁当屋さん', want:'お昼の弁当二百食分。'},
  {who:'寿司屋の大将', want:'しゃりにするから粒立ちよく。'},
  {who:'保育園の給食室', want:'子どもたちのお昼に。'},
];
const BAG_PLAN = [10, 30, 10];                 // 10kg袋は調整2回、30kg袋は調整3回
const SHARES = {2:[0.15,0.425,0.425], 3:[0.10,0.30,0.30,0.30]};
// 分銅：棒に通した円筒の分銅（写真の大・小）。棒の先へずらすほど、てこで抵抗板を強く押す。
const DISCS = [{name:'大',kg:3},{name:'小',kg:2}];
const NOTCH_MIN=3, NOTCH_MAX=10;               // 棒の目盛（0.5刻み）

/* ---------- 精米モデル ----------
   d：搗精の深さ（0=玄米 … 100=削りすぎ）
   果皮・種皮 0–22 / 糊粉層 22–48 / 亜糊粉層 48–74 / 胚乳 74–
   ちょうど良いのは糊粉層が落ち、亜糊粉層が残る d≈53–63（最良58）。 */
const LAYERS = [
  {key:'hi', name:'果皮・種皮', a:0, b:22, col:'#8b5a2b'},
  {key:'ko', name:'糊粉層', a:22, b:48, col:'#c39a52'},
  {key:'ako', name:'亜糊粉層', a:48, b:74, col:'#efe0a8'},
];
const BEST = 58;
function polish(w, ease, temp){ return w*13*ease + (temp-25)*0.8; }   // 機械が温まるほどよく削れる
function quality(d){
  const x = d-BEST;
  return Math.max(0, Math.min(100, 100 - (x<0 ? 0.8 : 1.0)*x*x));
}
function verdict(d){
  if (d<44) return {t:'黒すぎ', c:'var(--nuka)'};
  if (d<53) return {t:'やや黒い', c:'#c9a873'};
  if (d<=63) return {t:'ちょうど', c:'var(--good)'};
  if (d<=70) return {t:'やや白い', c:'#c8cdd0'};
  return {t:'白すぎ', c:'var(--chalk)'};
}
function rankOf(s){
  if (s>=88) return {r:'特A', m:'亜糊粉層がきれいに残った、甘みのある米。'};
  if (s>=75) return {r:'A', m:'よく仕上がった。店に並べて恥ずかしくない。'};
  if (s>=60) return {r:"A'", m:'悪くはないが、ところどころ加減が外れた。'};
  if (s>=40) return {r:'B', m:'ムラが大きい。炊くと差が出る。'};
  return {r:"B'", m:'これは客に出せない。搗き直しだ。'};
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
// ゲームの乱数（日替わりモードでは日付で種を決め、誰がやっても同じ朝になる）。情景の演出は Math.random のまま。
let RNG=Math.random;
const rr=(a,b)=>a+RNG()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=RNG();while(!v)v=RNG();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=RNG()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function todayLabel(){const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日`;}

/* 粒の色：玄米の飴色 → 生成り（亜糊粉層） → チョークのような白 */
const STOPS=[[0,[150,102,56]],[22,[176,136,84]],[40,[204,178,128]],[52,[226,212,172]],[58,[236,228,200]],[64,[242,238,220]],[72,[240,244,247]],[100,[250,252,255]]];
function grainRGB(d){
  d=clamp(d,0,100);
  for(let i=1;i<STOPS.length;i++){
    if(d<=STOPS[i][0]){const [a,ca]=STOPS[i-1],[b,cb]=STOPS[i];const t=(d-a)/(b-a);
      return ca.map((v,k)=>Math.round(v+(cb[k]-v)*t));}
  }
  return STOPS[STOPS.length-1][1];
}
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- 状態 ---------- */
const S = {
  phase:'title', bags:[], bagIdx:0, temp:12, minutes:330,
  w:0, discs:[true,true], notch:6.5,          // 前日のまま：大小2個・目盛6.5
  tab:'slip', seen:{look:false,touch:false},
};
const $=id=>document.getElementById(id);

function newGame(daily){
  S.daily=!!daily;
  RNG = daily ? mulberry(todayKey()*7919) : Math.random;
  const vs=shuffle(VARIETIES).slice(0,3);
  const cs=shuffle(CUSTOMERS).slice(0,3);
  S.bags = BAG_PLAN.map((kg,i)=>{
    const v=vs[i], c=CONDS[RNG()*CONDS.length|0];
    const n = kg===10?2:3;
    return {kg, v, cond:c, cust:cs[i], n, ease:v.ease*c.f*(1+rr(-0.03,0.03)),
            shares:SHARES[n], segs:[], segIdx:0, done:false, score:0};
  });
  S.bagIdx=0; S.temp=rr(11,14); S.minutes=330;
  setRig([true,true],6.5);
  startBag();
}
function bag(){return S.bags[S.bagIdx];}
function rigMass(d){return DISCS.reduce((s,x,i)=>s+(d[i]?x.kg:0),0);}
function setRig(discs,notch){
  S.discs=discs.slice();
  S.notch=clamp(Math.round(notch*2)/2,NOTCH_MIN,NOTCH_MAX);
  S.w=rigMass(S.discs)*S.notch/10*1.2;          // てこの押さえ（kg相当）
}
function fmtRig(discs=S.discs,notch=S.notch){const m=rigMass(discs);return m?`${m}kg・目盛${notch.toFixed(1)}`:'分銅なし';}

function startBag(){
  const b=bag();
  S.phase='slip'; S.tab='slip';
  S.flowKg=0; S.lastSeg=null;
  say('親方', `${b.cust.who}の${b.kg}kg。品種は${b.v.name}。分銅はいま${fmtRig()}。伝票を見て、始めろ。`);
  note(null);
  render();
}

/* 1区間ぶん流す */
function runSegment(){
  const b=bag();
  const i=b.segIdx, share=b.shares[i];
  const heatScale = b.kg/30*0.5+0.5;
  const coolLimit = Math.max(0.3,(55-S.temp)/35);
  const rise = share*(10+2.5*S.w)*heatScale*coolLimit;
  const tMid = S.temp + rise/2;
  const d = polish(S.w,b.ease,tMid) + gauss()*1.4;
  const seg = {w:S.w, rig:fmtRig(), notch:S.notch, mass:rigMass(S.discs), d, kg:b.kg*share, tStart:S.temp, tEnd:S.temp+rise};
  b.segs.push(seg);
  S.phase='flow'; S.tab=null;
  S.flowFrom = S.flowKg; S.flowTo = S.flowKg + seg.kg;
  S.flowD = d; S.flowTemp0=S.temp; S.flowTemp1=S.temp+rise;
  S.flowMin0=S.minutes; S.flowMin1=S.minutes + seg.kg*1.6;
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 500 : 1400 + share*5200;
  S.flowT0=performance.now(); S.flowDur=dur;
  say(null, i===0 ? 'スイッチを入れる。モーターがうなり、玄米がホッパーへ吸い込まれていく。' :
                   `分銅${fmtRig()}で流す。抵抗板が押し返し、白い粒が出口からこぼれはじめる。`, true);
  note(null);
  render();
  requestAnimationFrame(flowTick);
}
function flowTick(now){
  if(S.phase!=='flow') return;
  const t=clamp((now-S.flowT0)/S.flowDur,0,1);
  S.flowKg = S.flowFrom+(S.flowTo-S.flowFrom)*t;
  S.temp = S.flowTemp0+(S.flowTemp1-S.flowTemp0)*t;
  S.minutes = S.flowMin0+(S.flowMin1-S.flowMin0)*t;
  updateMeters();
  if(t<1){requestAnimationFrame(flowTick);return;}
  segmentDone();
}
function segmentDone(){
  const b=bag();
  const seg=b.segs[b.segIdx];
  b.segIdx++;
  S.lastSeg=seg;
  // 観察値（見る・触る）を作る：見た目は品種のクセとブレ、手ざわりは別のブレ
  seg.eye = seg.d + b.v.look + gauss()*2.2;
  seg.hand = seg.d + gauss()*2.6;
  seg.nuka = seg.d + gauss()*3.0;
  if(b.segIdx>=b.shares.length){ finishBag(); return; }
  S.phase='adjust'; S.tab='look'; S.seen={look:false,touch:false};
  const left=b.shares.length-b.segIdx;
  say('親方', b.segIdx===1
      ? `出てきたぞ。手に取って、見て、触ってみろ。分銅を掛け替えられるのは、この袋であと${left}回だ。`
      : `次の米が出てきた。分銅を触れるのはあと${left}回。`);
  note(S.bagIdx===0&&b.segIdx===1 ? '下の「見る」「触る」で米を確かめてから、「分銅」で加減する。上の画面の分銅は指でずらせる。' : null);
  render();
}
function finishBag(){
  const b=bag();
  const total=b.segs.reduce((s,x)=>s+x.kg,0);
  b.score=Math.round(b.segs.reduce((s,x)=>s+quality(x.d)*x.kg,0)/total);
  b.done=true;
  S.phase='bagResult'; S.tab=null;
  S.temp=Math.max(12,S.temp-4); S.minutes+=12;
  const rk=rankOf(b.score);
  stamp(rk.r, b.score>=75);
  say('親方', rk.m);
  note(null);
  render();
}
function nextBag(){
  if(S.bagIdx<S.bags.length-1){S.bagIdx++; startBag();}
  else{S.phase='final'; S.tab=null; finalSay(); render();}
}
function finalSay(){
  const avg=Math.round(S.bags.reduce((s,b)=>s+b.score,0)/S.bags.length);
  S.avg=avg;
  let line;
  if(avg>=88) line='文句なしだ。明日から分銅はお前に任せる。';
  else if(avg>=75) line='まずまずだ。手が米の声を聞きはじめてる。';
  else if(avg>=60) line='まだ手が迷ってる。黒と白のあいだは、思ってるより狭い。';
  else line='今朝の米はわしが搗き直す。明日もう一度だ。';
  say('親方', line);
  try{
    const best=+localStorage.getItem('akofun-best')||0; if(avg>best) localStorage.setItem('akofun-best',avg);
    const hist=JSON.parse(localStorage.getItem('akofun-hist')||'[]');
    hist.unshift({day:S.daily?todayLabel():'おまかせ', avg, bags:S.bags.map(b=>rankOf(b.score).r)});
    localStorage.setItem('akofun-hist',JSON.stringify(hist.slice(0,5)));
  }catch(e){}
}

/* ---------- 観察テキスト ---------- */
function eyeWords(e){
  if(e<30) return '飴色の殻をかぶったまま。胚芽も黄色く残って、ほとんど玄米だ。';
  if(e<42) return '茶色い筋が粒の背に残っている。糊粉層がまだ厚い。';
  if(e<50) return '全体に黄みがかったクリーム色。うっすら糠の膜が見える。';
  if(e<55) return '生成りの、ほんのり透ける白。粒の肩にわずかに黄みが残る。';
  if(e<62) return '艶のある生成り。光にかざすと、表面の下に淡い金色の層が見える。';
  if(e<69) return '白くなってきた。透明感が薄れ、粉をふいたような白が混じる。';
  return 'チョークのような真っ白。艶がなく、粒の角が立っている。';
}
function handWords(h){
  if(h<35) return {t:'しっとり重い。指にべったり糠粉がつく。', k:'糠っぽい'};
  if(h<47) return {t:'ややしっとり。こすると指先が少し黄ばむ。', k:'しっとり'};
  if(h<54) return {t:'さらりとしてきた。指先にかすかに粉が残る。', k:'さらり手前'};
  if(h<62) return {t:'さらさらと指のあいだを抜ける。粉はつかない。', k:'さらり'};
  if(h<69) return {t:'握るとキュッと鳴る。粒が硬く締まっている。', k:'キュッ'};
  return {t:'キシキシと鳴り、角がとがって手に刺さる。割れた粒が混じる。', k:'キシキシ'};
}
function tempWords(t){
  if(t<18) return 'ひんやりしている。機械はまだ冷えていて、削れが鈍い。';
  if(t<26) return 'ぬるい。機械がようやく温まりはじめた。';
  if(t<33) return '人肌くらい。これから先、機械はもっと温まって削れが進む。';
  if(t<40) return 'はっきり温かい。機械が温まって、同じ分銅でもよく削れる。';
  return '熱い。機械が熱をもって削れすぎている。米も焼けはじめる。';
}

function nukaWords(n){
  if(n<44) return '赤茶色の粗い糠がぱらぱら。まだ外の皮しか落ちていない。';
  if(n<53) return '茶色い糠に、黄色っぽい糠が混じってきた。糊粉層が落ちはじめている。';
  if(n<=63) return '淡い黄土色の、きめの細かい糠。糊粉層がちょうど落ちきった色だ。';
  if(n<=70) return '糠が白っぽくなってきた。中まで削れはじめている。';
  return '真っ白な粉がどっさり。白糠が出ている。削りすぎだ。';
}
function nukaRGB(n){
  const st=[[30,[120,72,38]],[48,[170,122,62]],[58,[205,170,104]],[66,[226,212,182]],[76,[244,242,236]]];
  n=clamp(n,30,76);
  for(let i=1;i<st.length;i++) if(n<=st[i][0]){const [a,ca]=st[i-1],[b,cb]=st[i],t=(n-a)/(b-a);return ca.map((v,k)=>Math.round(v+(cb[k]-v)*t));}
  return st[st.length-1][1];
}

/* ---------- 描画（パネル） ---------- */
function fmtW(w){return w.toFixed(1)+'kg';}
function fmtClock(m){const h=Math.floor(m/60),mm=Math.floor(m%60);return h+':'+String(mm).padStart(2,'0');}
function softDots(n){let s='<span class="soft" aria-label="やわらかさ'+n+'/5">';for(let i=1;i<=5;i++)s+=`<i class="${i<=n?'on':''}"></i>`;return s+'</span>';}
const NUKA_WORD=['','かため','やや硬め','ふつう','ややもやわらか','とてもやわらかい'];

function render(){
  const b=bag();
  // tabs
  const adj = S.phase==='adjust';
  const tabsOn = adj || S.phase==='slip';
  document.querySelectorAll('#tabs button').forEach(btn=>{
    const t=btn.dataset.tab;
    const enabled = (adj && t!=='slip') || t==='slip' && (tabsOn) || (adj && t==='slip');
    btn.disabled = !enabled;
    btn.setAttribute('aria-selected', String(S.tab===t));
    btn.classList.toggle('dotbadge', adj && ((t==='look'&&!S.seen.look)||(t==='touch'&&!S.seen.touch)));
  });
  $('tabs').hidden = !(adj || S.phase==='slip');
  $('meters').hidden = S.phase==='title';
  updateMeters();
  const P=$('panel');
  if(S.phase==='title') P.innerHTML=titleHTML();
  else if(S.phase==='slip') P.innerHTML=slipHTML(true);
  else if(S.phase==='flow') P.innerHTML=flowHTML();
  else if(S.phase==='adjust'){
    if(S.tab==='look'){P.innerHTML=lookHTML(); S.seen.look=true; drawTray(); syncBadges();}
    else if(S.tab==='touch'){P.innerHTML=touchHTML(); S.seen.touch=true; setupTouch(); if(S.lastSeg.felt) revealFeel(); syncBadges();}
    else if(S.tab==='weight') P.innerHTML=weightHTML();
    else P.innerHTML=slipHTML(false);
  }
  else if(S.phase==='bagResult') P.innerHTML=bagResultHTML();
  else if(S.phase==='final'){ P.innerHTML=finalHTML(); startBowl(); }
  P.scrollTop=0;
}
function syncBadges(){
  document.querySelectorAll('#tabs button').forEach(btn=>{
    const t=btn.dataset.tab;
    btn.classList.toggle('dotbadge', S.phase==='adjust' && ((t==='look'&&!S.seen.look)||(t==='touch'&&!S.seen.touch)));
  });
}
function updateMeters(){
  const b=bag();
  const total=b?b.kg:10;
  const kg = S.phase==='title'?0 : (S.phase==='bagResult'||S.phase==='final') ? total : (S.flowKg||0);
  $('mKg').textContent = `${kg.toFixed(kg<10?1:0)} / ${total}kg`;
  $('fKg').style.width = (kg/total*100)+'%';
  $('mW').textContent = rigMass(S.discs)+'kg・'+S.notch.toFixed(1);
  const ch=$('chances'); ch.innerHTML='';
  if(b){
    const n=b.n, used = S.phase==='bagResult'||S.phase==='final' ? n : S.phase==='flow' ? b.segIdx : Math.max(0,b.segIdx-1);
    for(let i=0;i<n;i++){const e=document.createElement('i');e.className = i<used?'used':'left';ch.appendChild(e);}
  }
  $('clock').textContent=fmtClock(S.minutes);
  $('hudR').textContent=fmtClock(S.minutes)+'　開店 9:00';
  $('bagNo').textContent = b?`第${S.bagIdx+1}袋 / ${S.bags.length}袋`:'—';
  $('hudL').textContent = b && S.phase!=='title' ? `${b.v.name} ${b.kg}kg` : '近藤米穀店 精米場';
  $('lamp').classList.toggle('on', S.phase==='flow');
}

function titleHTML(){
  let best=0, hist=[]; try{best=+localStorage.getItem('akofun-best')||0; hist=JSON.parse(localStorage.getItem('akofun-hist')||'[]');}catch(e){}
  const lay=LAYERS.map(l=>`<span style="width:${(l.b-l.a)}%;background:${l.col}"></span>`).join('')+`<span style="width:26%;background:#f7f5ee"></span>`;
  return `<div class="stack title">
    <div><p class="sub">近藤米穀店 らいすぴあ 精米場</p><h1>亜糊粉層を残せ</h1>
      <p class="lead" style="margin:6px 0 0">分銅ひとつで米の白さが変わる。黒すぎず、白すぎず。旨みの層だけを残して、開店までに3袋を仕上げる。</p></div>
    <div class="stack" style="gap:8px">
      <button class="btn" id="bDaily">${todayLabel()}の朝（日替わり）</button>
      <button class="btn ghost" id="bStart">おまかせの朝（毎回ちがう）</button>
    </div>
    <p class="h3" style="margin:6px 0 0">遊び方</p>
    <ul class="rules" style="margin:0">
      <li><b>仕事</b><span>開店前に、玄米を3袋精米する。10kg、30kg、10kg。</span></li>
      <li><b>分銅</b><span>精米機の出口には抵抗板があり、てこの棒に通した円筒の分銅で押さえている。分銅を棒の先へずらすほど米が強く擦れて白く、手前へずらすほど黒く仕上がる。</span></li>
      <li><b>狙い</b><span>糠の層を外から落としていき、旨みと甘みのある<strong>亜糊粉層</strong>だけを残す。黒すぎれば糠臭く、白すぎれば旨みが消える。
        <div class="layers" aria-hidden="true">${lay}</div>
        <small style="color:var(--muted)">果皮・種皮 → 糊粉層 → <span style="color:#efe0a8">亜糊粉層（残す）</span> → 胚乳</small></span></li>
      <li><b>確かめる</b><span>出てきた米を<strong>見て</strong>色と艶を、<strong>触って</strong>手ざわりと温もりを確かめる。見た目だけでは騙される品種もある。</span></li>

  </div>`;
}

function flowHTML(){
  return `<div class="stack"><p class="lead">精米中…… 出口から米が落ちている。次に止めたとき、出てきた米を確かめられる。</p></div>`;
}
function lookHTML(){
  const s=S.lastSeg, b=bag();
  const e=s.eye;
  // 断面：見た目の値で描く（見た目のクセもそのまま乗る）
  const rem=LAYERS.map(l=>clamp((l.b-e)/(l.b-l.a),0,1));
  const core=74, cx=70, cy=48;
  const full=[7,8,10];
  let rx=48, ry=26;
  const shrink=e>74?clamp((e-74)/26,0,1)*10:0;
  rx-=shrink; ry-=shrink*0.55;
  let rings=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#f7f5ee"/>`;
  // 内側から外へ：亜糊粉 → 糊粉 → 果皮
  let R=[rx,ry]; const parts=[];

    ${b.v.look?`<p class="lead" style="margin:0">伝票のメモ：${b.v.name}は見た目が白く出やすい。</p>`:''}

}

function custVoice(b){
  const ds=b.segs.map(x=>x.d), avg=ds.reduce((a,x,i)=>a+x*b.segs[i].kg,0)/b.kg;
  const spread=Math.max(...ds)-Math.min(...ds);
  if(b.score>=88) return '「炊きあがりの香りが違うね。噛むほど甘い。また頼むよ」';
  if(b.score>=75) return avg<58 ? '「おいしいよ。ほんの少し糠の香りがするけど、それもいい」' : '「おいしいよ。粒がそろって、つやつやだ」';

  return '「うーん、いつもと何か違う気がするな」';

function bagAdvice(b){
  const ds=b.segs.map(s=>s.d);
  const first=ds[0], rest=ds.slice(1);
  const hi=rest.filter(d=>d>63).length, lo=rest.filter(d=>d<53).length;
  if(!hi&&!lo&&first>=53&&first<=63) return '出だしから最後まで、亜糊粉層を残しきった。';
  if(hi&&b.segs[b.segs.length-1].d>63) return '後半が白くなった。機械が温まると同じ分銅でもよく削れる。先回りして軽くしておけ。';

  if(first<53) return '出だしが黒かった。冷えた機械と前の袋の分銅のままだと、最初はどうしても外れる。';
  if(first>63) return '出だしが白すぎた。前の袋の分銅が強すぎた。';
  return '途中で加減が行ったり来たりした。見た目と手ざわりを両方合わせて読め。';
}

/* ---------- 炊きあがり（最後の画面） ---------- */
function startBowl(){
  const cv=$('bowlCv'); if(!cv) return;
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const all=S.bags.flatMap(b=>b.segs);
  const tot=all.reduce((a,x)=>a+x.kg,0);
  const rand=mulberry(Math.round(S.avg*13+7));
  const grains=[];
  const by0=H*0.62, bw0=W*0.33;
  for(let i=0;i<260;i++){ // 袋の中身の割合どおりに粒を混ぜて、茶碗にこんもり盛る
    let r=rand()*tot, seg=all[0]; for(const x of all){ if(r<x.kg){seg=x;break;} r-=x.kg; }
    const u=rand()*2-1, top=Math.sqrt(1-u*u);
    grains.push({x:W/2+u*bw0*0.96, y:by0+4-rand()*top*H*0.3, a:rand()*Math.PI, d:seg.d});
  }
  grains.sort((p,q)=>p.y-q.y);
  const steam=[0,1,2].map(i=>({x:W/2+(i-1)*W*0.09,p:i*2}));
  function frame(now){
    if(!document.body.contains(cv)) return;
    g.clearRect(0,0,W,H);
    // ごはんの山
    const by=H*0.62;
    for(const p of grains){
      const c=grainRGB(p.d+12); // 炊くと白く透ける
      g.save(); g.translate(p.x,p.y); g.rotate(p.a);
      g.fillStyle=rgb(c); g.beginPath(); g.ellipse(0,0,5.6,3.4,0,0,Math.PI*2); g.fill();
      const shine=p.d>50&&p.d<66?.7:p.d<50?.25:.2;
      g.fillStyle=`rgba(255,255,255,${shine})`; g.beginPath(); g.ellipse(-1,-1.3,2.6,.8,0,0,Math.PI*2); g.fill();
      g.restore();
    }
    // 茶碗
    const bw=W*0.33;
    const bg=g.createLinearGradient(W/2-bw,0,W/2+bw,0); bg.addColorStop(0,'#2a3b52'); bg.addColorStop(0.45,'#4b6688'); bg.addColorStop(1,'#1d2a3b');
    g.fillStyle=bg; g.beginPath(); g.moveTo(W/2-bw,by); g.quadraticCurveTo(W/2-bw*0.95,H*0.96,W/2,H*0.96); g.quadraticCurveTo(W/2+bw*0.95,H*0.96,W/2+bw,by); g.closePath(); g.fill();
    g.strokeStyle='rgba(230,236,245,.5)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(W/2-bw*0.7,by+H*0.12); g.quadraticCurveTo(W/2,by+H*0.2,W/2+bw*0.7,by+H*0.12); g.stroke();
    g.fillStyle='#16110b'; g.fillRect(W/2-bw*0.32,H*0.96,bw*0.64,4);
    // 湯気（おいしいほど立つ）
    const k=clamp((S.avg-40)/50,0.15,1);
    if(!REDUCED) for(const st of steam){
      g.strokeStyle=`rgba(255,250,238,${0.18*k})`; g.lineWidth=5; g.lineCap='round'; g.beginPath();
      for(let y=0;y<H*0.32;y+=4){const x=st.x+Math.sin(y/12+now/700+st.p)*6; y===0?g.moveTo(x,H*0.24-y):g.lineTo(x,H*0.24-y);} g.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- 手のひらの米（見る） ---------- */
function drawTray(){
  const cv=$('trayCv'); if(!cv) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth||320, H=cv.clientHeight||130;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  // 手のひら
  const pg=g.createRadialGradient(W/2,H*0.62,10,W/2,H*0.62,W*0.5);
  pg.addColorStop(0,'#c99a76'); pg.addColorStop(0.6,'#a8775a'); pg.addColorStop(1,'#2b2015');
  g.fillStyle='#2b2015'; g.fillRect(0,0,W,H);
  g.fillStyle=pg; g.beginPath(); g.ellipse(W/2,H*0.66,W*0.36,H*0.5,0,0,Math.PI*2); g.fill();
  const e=S.lastSeg.eye;
  const seedRand=mulberry(Math.round(S.lastSeg.d*100)+S.bagIdx*7);
  for(let i=0;i<46;i++){
    const a=seedRand()*Math.PI*2, r=Math.sqrt(seedRand());
    const x=W/2+Math.cos(a)*r*W*0.28, y=H*0.6+Math.sin(a)*r*H*0.32;
    grain(g,x,y,seedRand()*Math.PI,e+ (seedRand()-0.5)*7, 1.15, seedRand);
  }
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function grain(g,x,y,ang,d,sc,rand){
  const c=grainRGB(d);
  g.save(); g.translate(x,y); g.rotate(ang); g.scale(sc,sc);
  g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(1,1.5,7,4.2,0,0,Math.PI*2); g.fill();
  const gr=g.createLinearGradient(0,-4,0,4);
  gr.addColorStop(0,rgb(c.map(v=>Math.min(255,v+18))));
  gr.addColorStop(1,rgb(c.map(v=>v-22)));
  g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,7,4.2,0,0,Math.PI*2); g.fill();
  // 糠の筋
  if(d<46){g.strokeStyle=`rgba(110,70,35,${clamp((46-d)/30,0,.7)})`; g.lineWidth=0.8; g.beginPath(); g.moveTo(-5,0); g.quadraticCurveTo(0,-1.5,5,0); g.stroke();}
  // 胚芽
  const germ=clamp((40-d)/25,0,1);
  if(germ>0){g.fillStyle=`rgba(214,170,70,${germ})`; g.beginPath(); g.ellipse(-6,1.2,1.8,1.4,0,0,Math.PI*2); g.fill();}
  // 艶
  const shine = d>48&&d<68 ? .55 : d>=68 ? .15 : .2;
  g.fillStyle=`rgba(255,255,255,${shine})`; g.beginPath(); g.ellipse(-1.5,-1.8,3.2,0.9,0,0,Math.PI*2); g.fill();
  // 割れ（削りすぎ）
  if(d>72 && rand && rand()<clamp((d-70)/20,0,.6)){g.strokeStyle='rgba(120,130,140,.7)';g.lineWidth=.7;g.beginPath();g.moveTo(-1,-4);g.lineTo(1,4);g.stroke();}
  g.restore();
}

/* ---------- 触る ---------- */
let touchState=null;
function setupTouch(){
  const tp=$('tp'), cv=$('tpCv'); if(!tp) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=tp.clientWidth, H=tp.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const s=S.lastSeg;
  const rand=mulberry(Math.round(s.d*37)+3);
  const pts=[];
  for(let i=0;i<170;i++) pts.push({x:rand()*W,y:H*0.25+rand()*H*0.75,a:rand()*Math.PI,v:(rand()-0.5)*6,vx:0,vy:0});
  touchState={g,W,H,pts,rub:0,done:false,last:null,s};
  drawTouch();
  const move=(ev)=>{
    const r=tp.getBoundingClientRect(); const x=ev.clientX-r.left, y=ev.clientY-r.top;
    if(touchState.last){
      const dx=x-touchState.last.x, dy=y-touchState.last.y, dist=Math.hypot(dx,dy);
      touchState.rub+=dist; if(dist>2) rubSound(touchState.s.hand);
      for(const p of touchState.pts){const dd=Math.hypot(p.x-x,p.y-y); if(dd<34){p.vx+=dx*0.25*(1-dd/34); p.vy+=dy*0.25*(1-dd/34);}}
    }
    touchState.last={x,y,t:performance.now()};
    if(!touchState.done && touchState.rub>260) revealFeel();
  };
  let down=false;
  tp.onpointerdown=(ev)=>{down=true; tp.setPointerCapture?.(ev.pointerId); touchState.last=null; move(ev); if(!touchState.anim) animTouch();};
  tp.onpointermove=(ev)=>{if(down) move(ev);};
  tp.onpointerup=tp.onpointercancel=()=>{down=false; touchState.last=null;};
  // キーボードでも触れるように
  tp.tabIndex=0; tp.setAttribute('role','button'); tp.setAttribute('aria-label','米を手で触って確かめる');
  tp.onkeydown=(ev)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); revealFeel();}};
  tp.onclick=()=>{ if(!touchState.done && touchState.rub<5){ touchState.rub+=90; for(const p of touchState.pts){p.vy-=rnd(0,3);} if(!touchState.anim) animTouch(); if(touchState.rub>260) revealFeel(); } };
}
function animTouch(){
  if(!touchState||!$('tpCv')){touchState&&(touchState.anim=false);return;}
  touchState.anim=true;
  let moving=false;
  for(const p of touchState.pts){
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.86; p.vy*=0.86; p.a+=p.vx*0.05;
    if(p.x<4)p.x=4; if(p.x>touchState.W-4)p.x=touchState.W-4; if(p.y<touchState.H*0.2)p.y=touchState.H*0.2; if(p.y>touchState.H-4)p.y=touchState.H-4;
    if(Math.abs(p.vx)+Math.abs(p.vy)>0.05) moving=true;
  }
  drawTouch();
  if(moving) requestAnimationFrame(animTouch); else touchState.anim=false;
}
function drawTouch(){
  const {g,W,H,pts,s}=touchState;
  g.clearRect(0,0,W,H);
  // 指についた糠粉（しっとりなほど多い）
  for(const p of pts) grain(g,p.x,p.y,p.a,s.d+p.v,1.05,null);
  if(touchState.rub>0 && s.hand<52){
    g.fillStyle=`rgba(170,120,60,${clamp((52-s.hand)/40,0,.35)})`;
    for(let i=0;i<30;i++){g.beginPath(); g.arc(W*0.5+Math.sin(i*7.3)*W*0.35, H*0.5+Math.cos(i*3.1)*H*0.3, 1.2,0,Math.PI*2); g.fill();}
  }
}
function revealFeel(){
  if(!touchState||touchState.done) return;
  touchState.done=true;
  const s=touchState.s, hw=handWords(s.hand);
  s.felt=true;
  $('feel').hidden=false; $('tpHint').textContent='手ざわり：'+hw.k;
  $('feelTex').textContent=hw.t;
  $('feelTemp').textContent='温もり：'+tempWords(s.tEnd);
  requestAnimationFrame(()=>{
    $('mkTex').style.left=clamp((s.hand-30)/(80-30)*100,3,97)+'%';
    $('mkTemp').style.left=clamp((s.tEnd-10)/(46-10)*100,3,97)+'%';
  });
  if(navigator.vibrate){try{navigator.vibrate(s.hand>66?[8,30,8,30,8]:s.hand<48?[25]:[10]);}catch(e){}}
}

/* ---------- 音（モーター・擦れる音・米の落ちる音）。擦れる音は白くなるほど高く鋭くなる ---------- */
const AU={ctx:null,on:false,n:null,lastRub:0};
try{AU.on=localStorage.getItem('akofun-sound')==='1';}catch(e){}
function ensureAudio(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume().catch(()=>{}); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  let ctx; try{ctx=new C();}catch(e){return;}
  AU.ctx=ctx;
  const master=ctx.createGain(); master.gain.value=0.6; master.connect(ctx.destination);
  const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  const noise=()=>{const n=ctx.createBufferSource(); n.buffer=buf; n.loop=true; n.start(); return n;};
  const mo=ctx.createOscillator(); mo.type='sawtooth'; mo.frequency.value=47;
  const mlp=ctx.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=220;
  const mg=ctx.createGain(); mg.gain.value=0; mo.connect(mlp); mlp.connect(mg); mg.connect(master); mo.start();
  const hbp=ctx.createBiquadFilter(); hbp.type='bandpass'; hbp.Q.value=1.3; hbp.frequency.value=900;
  const hg=ctx.createGain(); hg.gain.value=0; noise().connect(hbp); hbp.connect(hg); hg.connect(master);
  const php=ctx.createBiquadFilter(); php.type='highpass'; php.frequency.value=3200;
  const pg=ctx.createGain(); pg.gain.value=0; noise().connect(php); php.connect(pg); pg.connect(master);
  AU.n={master,mo,mg,hbp,hg,pg,buf};
}
function audioWake(){ if(AU.on) ensureAudio(); }
function audioFrame(){
  if(!AU.ctx||!AU.n) return;
  const t=AU.ctx.currentTime, n=AU.n, run=AU.on&&S.phase==='flow';
  n.mg.gain.setTargetAtTime(run?0.16:0,t,0.25);
  n.hg.gain.setTargetAtTime(run?0.11:0,t,0.3);
  n.pg.gain.setTargetAtTime(run?0.03:0,t,0.3);
  if(run){
    n.hbp.frequency.setTargetAtTime(450+clamp(S.flowD||50,20,90)*17,t,0.4);
    n.mo.frequency.setTargetAtTime(47-clamp(S.w,0,7)*0.9,t,0.5);       // 押さえが強いほどモーターが沈む
  }
}
function blip(freq,dur,type,vol){
  if(!AU.on||!AU.ctx||!AU.n) return;
  const ctx=AU.ctx,t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.6,t+dur);
  g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AU.n.master); o.start(t); o.stop(t+dur+0.02);
}
function rubSound(h){
  if(!AU.on||!AU.ctx||!AU.n) return;
  const now=performance.now(); if(now-AU.lastRub<70) return; AU.lastRub=now;
  const ctx=AU.ctx,t=ctx.currentTime,src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=AU.n.buf; bp.type='bandpass'; bp.frequency.value=900+clamp(h-30,0,50)*90; bp.Q.value=2+clamp(h-55,0,20)*0.3;
  g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  src.connect(bp); bp.connect(g); g.connect(AU.n.master); src.start(t,Math.random()); src.stop(t+0.1);
}
function toggleSound(){
  AU.on=!AU.on; try{localStorage.setItem('akofun-sound',AU.on?'1':'0');}catch(e){}
  if(AU.on) ensureAudio(); syncSoundBtn();
}

/* ---------- 親方の台詞・判子 ---------- */
function say(who,text,narr){
  $('who').textContent=who||'';
  const p=$('said'); p.textContent=text; p.classList.toggle('narr',!!narr);
}
function note(t){const n=$('note'); if(!t){n.hidden=true;return;} n.hidden=false; n.textContent=t;}
function stamp(t,good){blip(good?140:80,0.35,'triangle',0.3);const s=$('stamp'); s.textContent=t; s.classList.toggle('good',!!good); s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');}

/* ---------- 入力 ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button'); if(!t||t.disabled) return;
  if(t.id==='bStart'){audioWake(); newGame(false); return;}
  if(t.id==='bDaily'){audioWake(); newGame(true); return;}
  if(t.id==='bCopy'){copyResult(t); return;}
  if(t.id==='bSound'){toggleSound(); return;}
  if(t.id==='bRun'){audioWake(); runSegment(); return;}
  if(t.id==='bGo'){ const blind=!S.seen.look&&!S.seen.touch; runSegment(); if(blind) note('親方：見もせず触りもせずに決めるのか。まあいい。'); return;}
  if(t.id==='bNext'){nextBag(); return;}
  if(t.id==='bAgain'){S.phase='title'; say('親方','夜明け前だ。今朝も3袋。'); render(); return;}
  if(t.dataset.tab){S.tab=t.dataset.tab; render(); afterTab(); return;}
  if(t.dataset.go){S.tab=t.dataset.go; render(); afterTab(); return;}
  if(t.dataset.disc!==undefined){
    const i=+t.dataset.disc; const d=S.discs.slice(); d[i]=!d[i];
    if(!d.some(Boolean)){ say('親方','分銅を全部外したら、抵抗板が開きっぱなしで玄米のまま出てくるぞ。'); return; }
    setRig(d,S.notch); blip(d[i]?200:260,0.28,'triangle',0.28); rerenderKeep(); return;
  }
  if(t.dataset.nudge!==undefined){ const b4=S.notch; setRig(S.discs,S.notch+(+t.dataset.nudge)); if(S.notch!==b4) blip(1700,0.05,'square',0.05); rerenderKeep(); return; }
});
function rerenderKeep(){const st=$('panel').scrollTop; render(); $('panel').scrollTop=st;}
function afterTab(){
  if(S.phase!=='adjust') return;
  const s=S.lastSeg;
  const first = S.bagIdx===0 && bag().segIdx===1;
  note(null);
  if(first && S.tab==='look') note('ルーペの断面で、茶色の糊粉層が消えて、金色の亜糊粉層が残っていればちょうどいい。');
  if(first && S.tab==='touch') note('さらさらで指に粉がつかなければちょうど。しっとりなら黒い、キシキシなら白すぎ。温もりは、この先の削れ方の目安。');
  if(first && S.tab==='weight') note('黒ければ分銅を先へ、白ければ手前へ。目盛1つで、搗き具合はおよそ一段変わる。');
  if(S.bagIdx===0 && bag().segIdx===2 && S.tab==='touch') note('さっきより温かい。機械が温まると、同じ分銅でも次はもっと白くなる。');
  if(S.tab==='look') say('親方', s.eye<53?'まだ黒いか？':s.eye>63?'白く見えるか？':'どう見える。');
  if(S.tab==='touch') say('親方','米は手でわかる。こすって、握ってみろ。');
  if(S.tab==='weight') say('親方', `この袋で分銅を触れるのは、あと${bag().shares.length-bag().segIdx}回だ。`);
  if(S.tab==='slip') say('親方', bag().v.memo);
}

function notchT(n){return 0.30+(n-NOTCH_MIN)/(NOTCH_MAX-NOTCH_MIN)*0.58;}   // 目盛 → 棒の位置(0..1)

function cyl(g,cx,cy,len,dia,ang,light){       // 棒に通した円筒（軸は棒の向き）

  const r=dia/2, ez=r*0.42;
  const gr=g.createLinearGradient(0,-r,0,r);
  gr.addColorStop(0,'#9ea3a3'); gr.addColorStop(0.18,light?'#f4f6f5':'#e3e6e4'); gr.addColorStop(0.45,'#c3c8c6'); gr.addColorStop(0.8,'#8d9392'); gr.addColorStop(1,'#6f7473');
  g.fillStyle=gr; g.fillRect(-len/2,-r,len,dia);
  g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(-len/2,-r,len,1.2);
  // 端面（右側）
  const fg=g.createRadialGradient(len/2-ez*0.3,-r*0.3,1,len/2,0,r);
  fg.addColorStop(0,'#eef0ef'); fg.addColorStop(1,'#a8adac');
  g.fillStyle=fg; g.beginPath(); g.ellipse(len/2,0,ez,r,0,0,Math.PI*2); g.fill();

}

    g.fillText('目盛 '+S.notch.toFixed(1),pC.x,pC.y-38.5);
  }
  // --- 出口のシュート（抵抗板の下の箱）
  g.fillStyle='#c9c6bd'; g.beginPath(); g.moveTo(46,240); g.lineTo(196,226); g.lineTo(188,268); g.lineTo(150,300); g.lineTo(86,300); g.lineTo(56,268); g.closePath(); g.fill();
  g.strokeStyle='rgba(110,106,96,.6)'; g.lineWidth=1; g.stroke();
  g.fillStyle='#8e8a80'; g.beginPath(); g.moveTo(70,250); g.lineTo(176,240); g.lineTo(162,282); g.lineTo(96,286); g.closePath(); g.fill();
  // 中に溜まった米
  const b=bag();
  const shownD = S.flowD!=null ? S.flowD : 58;
  const pile = S.phase==='flow' ? 1 : (S.phase==='adjust'||S.phase==='bagResult') ? 0.7 : 0.25;
  const gc=grainRGB(shownD);
  g.fillStyle=rgb(gc); g.beginPath(); g.ellipse(124,282,30*pile+8,9*pile+3,-0.08,0,Math.PI*2); g.fill();
  g.fillStyle=rgb(gc.map(v=>v-25),.8); for(let i=0;i<18;i++){g.beginPath(); g.ellipse(104+((i*13)%44),276+((i*7)%10),1.8,1,i,0,Math.PI*2); g.fill();}
  g.restore();

  // --- 出口からこぼれる米
  if(running && !REDUCED){
    for(let k=0;k<4;k++) parts.push({x:DX+rnd(-30,22)+sh,y:DY+56+rnd(-2,2),vx:rnd(-0.2,0.25),vy:rnd(0.2,0.9),a:rnd(0,3),d:S.flowD+rnd(-4,4),floor:rnd(272,290)});
    if(Math.random()<0.5) dust.push({x:DX+rnd(-40,40),y:DY+50,vx:rnd(-0.3,0.3),vy:rnd(-0.5,-0.1),life:1});
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.vy+=0.12; p.x+=p.vx; p.y+=p.vy; p.a+=0.1;
    if(p.y>p.floor){parts.splice(i,1);continue;}
    g.fillStyle=rgb(grainRGB(p.d)); g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.beginPath(); g.ellipse(0,0,2.1,1.2,0,0,Math.PI*2); g.fill(); g.restore();}
  for(let i=dust.length-1;i>=0;i--){const p=dust[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.01;
    if(p.life<=0){dust.splice(i,1);continue;}
    g.fillStyle=`rgba(236,224,196,${p.life*0.3})`; g.beginPath(); g.arc(p.x,p.y,2+(1-p.life)*7,0,Math.PI*2); g.fill();}
  // 光の中の糠ぼこり
  if(!REDUCED) for(const m of motes){m.y-=m.v; m.x+=Math.sin(now/1500+m.p)*0.08; if(m.y<-4){m.y=VH+4; m.x=Math.random()*VW;}
    g.fillStyle='rgba(255,236,200,.35)'; g.beginPath(); g.arc(m.x,m.y,0.8,0,Math.PI*2); g.fill();}
  // 夜明け前の暗さ（時間とともに明るく）
  const dawn=clamp((S.minutes-330)/180,0,1);
  g.fillStyle=`rgba(10,8,5,${0.32-dawn*0.2})`; g.fillRect(0,0,VW,VH);
  audioFrame();
  requestAnimationFrame(scene);
}
requestAnimationFrame(scene);

/* 分銅を指でずらす */
function toV(ev){const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left-VX)/VS, y:(ev.clientY-r.top-VY)/VS};}
function nearWeight(p){const c=rodPt(wPos); return Math.hypot(p.x-c.x,p.y-c.y)<42;}
function tOnRod(p){const dx=ROD.x1-ROD.x0, dy=ROD.y1-ROD.y0; return ((p.x-ROD.x0)*dx+(p.y-ROD.y0)*dy)/(dx*dx+dy*dy);}
function tToNotch(t){return NOTCH_MIN+(t-0.30)/0.58*(NOTCH_MAX-NOTCH_MIN);}
cv.addEventListener('pointerdown',ev=>{
  if(S.phase!=='adjust') return;
  const p=toV(ev);
  if(!nearWeight(p)) return;
  drag={off:tOnRod(p)-notchT(S.notch)}; cv.setPointerCapture?.(ev.pointerId); ev.preventDefault();
});
cv.addEventListener('pointermove',ev=>{
  const p=toV(ev);
  hoverW = S.phase==='adjust' && nearWeight(p);
  cv.style.cursor = drag?'grabbing':hoverW?'grab':'default';
  if(!drag) return;
  const n=tToNotch(tOnRod(p)-drag.off);
  const before=S.notch; setRig(S.discs,n);
  if(S.notch!==before){ blip(1700,0.05,'square',0.05); if(S.tab!=='weight'){S.tab='weight'; render();} else syncWeightPanel(); }
});
const endDrag=()=>{ if(drag){drag=null; if(S.phase==='adjust'){ if(S.tab!=='weight'){S.tab='weight'; render();} } } };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.style.touchAction='none';
function syncWeightPanel(){
  const n=$('wNotch'), t=$('wTotal'); if(n) n.textContent=S.notch.toFixed(1); if(t) t.textContent=S.w.toFixed(1);
  updateMeters();
}

/* ---------- 起動 ---------- */
function boot(data){
  syncSoundBtn();
  if(data && data.S && data.S.phase && data.S.phase!=='title'){
    Object.assign(S, data.S);
    if(S.phase==='flow'){ S.flowKg=S.flowTo; S.temp=S.flowTemp1; S.minutes=S.flowMin1; segmentDone(); return; }
    if(S.phase==='final') finalSay(); else say('親方','さあ、続きだ。');
    render(); return;
  }
  S.phase='title'; S.bags=[];
  say('親方','夜明け前だ。今朝も3袋。出てきた米を見て、触って、分銅で加減しろ。');
  render();
}
window.claude?.hot?.snapshot?.(()=>({S:JSON.parse(JSON.stringify(S))}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
