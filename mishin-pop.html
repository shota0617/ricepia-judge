<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>精米機に貼る紹介（ミシン糸 一本どり）</title>
<!-- コイン精米機の 中に 貼る 紹介（A4たて）。印刷して 使う。QR と 画面の 絵は tools/mishin/make-pop.py で 作る（読みこむと mishin.html#coin の れんしゅう） -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet"/>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#e6e1d6}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;color:#1d2a4a}
.sheet{width:210mm;height:297mm;margin:12px auto;background:#f6ecd6;padding:10mm 12mm 8mm;display:flex;flex-direction:column;align-items:center;gap:4mm;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:5mm;background:repeating-linear-gradient(90deg,#c0392b 0 6mm,#fff 6mm 9mm)}
.head{display:flex;align-items:center;gap:5mm;margin-top:2mm}
.kome{width:26mm;height:34mm;flex:none}
.say{background:#fff;border:.9mm solid #1d2a4a;border-radius:6mm;padding:4mm 6mm;position:relative}
.say::before{content:"";position:absolute;left:-4.2mm;top:11mm;border:2mm solid transparent;border-right:3.4mm solid #1d2a4a}
.say h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:10.5mm;line-height:1.3;margin:0;word-break:keep-all}
.say h1 b{color:#c0392b;font-weight:400}
.say p{margin:2mm 0 0;font-size:5.4mm;font-weight:700}
.name{font-family:"Dela Gothic One",sans-serif;font-size:7mm;margin:0;letter-spacing:.06em}
.name small{font-family:"Zen Maru Gothic",sans-serif;font-size:4.6mm;font-weight:700;letter-spacing:0;margin-left:2mm}
.shots{display:flex;gap:4mm;justify-content:center}
.shots figure{margin:0;width:56mm;text-align:center}
.shots img{display:block;width:56mm;height:80mm;object-fit:cover;object-position:top;border:1mm solid #1d2a4a;border-radius:3mm;background:#1d2a4a}
.shots figcaption{font-size:4.6mm;font-weight:700;line-height:1.4;margin-top:2mm;text-align:left;display:flex;gap:1.5mm;word-break:keep-all}
.shots figcaption i{font-style:normal;flex:none;width:6.4mm;height:6.4mm;border-radius:50%;background:#1d2a4a;color:#fff;display:grid;place-items:center;font-size:4mm}
.qrbox{display:flex;align-items:center;gap:7mm;background:#fff;border:1.2mm dashed #c0392b;border-radius:5mm;padding:4mm 8mm}
.qr{width:55mm;height:55mm;shape-rendering:crispEdges}
.how{font-size:5.6mm;font-weight:700;line-height:1.55;margin:0}
.how b{color:#c0392b;font-size:6.8mm}
.note{font-size:4.6mm;font-weight:500;text-align:center;margin:0;line-height:1.6}
.shop{margin-top:auto;font-size:4.6mm;font-weight:700;text-align:center;border-top:.6mm solid #1d2a4a;padding-top:2.5mm;width:100%}
.print{position:fixed;right:16px;bottom:16px;font:inherit;font-size:16px;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:#1d2a4a;color:#fff;cursor:pointer}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}.print{display:none}}
@media screen and (max-width:820px){.sheet{transform:scale(.45);transform-origin:top left;margin:0}}
</style>
</head>

    <svg class="kome" viewBox="0 0 52 68" role="img" aria-label="こめつぶ"><ellipse cx="26" cy="36" rx="22" ry="30" fill="#fff" stroke="#1d2a4a" stroke-width="2.4"/><circle cx="18" cy="34" r="2.6" fill="#1d2a4a"/><circle cx="34" cy="34" r="2.6" fill="#1d2a4a"/><ellipse cx="13" cy="41" rx="4" ry="2.4" fill="#f2a7a0"/><ellipse cx="39" cy="41" rx="4" ry="2.4" fill="#f2a7a0"/><path d="M22 41q4 4 8 0" fill="none" stroke="#1d2a4a" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="say">
