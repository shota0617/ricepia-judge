<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>店頭POP（にしおさんぽGO）</title>
<!-- 店頭のレジ横などに置くPOP（A4たて）。印刷して使う。QRは tools/make-pop.py で作る（読みこむと docs/marketing.md の「本店のレジ横のQR」のリンク）。手わたし用の名刺の大きさのカードは card.html -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet"/>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#e9efe6}
body{font-family:"DotGothic16",system-ui,sans-serif;color:#1f2a1f}
.sheet{width:210mm;height:297mm;margin:12px auto;background:#fff;padding:12mm 14mm 9mm;display:flex;flex-direction:column;align-items:center;gap:5mm;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.logo{width:150mm}
.tag{font-size:10mm;margin:0;text-align:center;color:#2f5d3a}
.sub{font-size:6.4mm;margin:-3mm 0 0;text-align:center;color:#b33a2a}
.shots{display:flex;gap:5mm;justify-content:center}
.shots figure{margin:0;width:52mm;text-align:center}
.shots img{display:block;width:52mm;aspect-ratio:1/2;object-fit:cover;object-position:top;max-height:80mm;border:1.2mm solid #2f5d3a;border-radius:3mm}
.shots figcaption{font-size:4.6mm;margin-top:1.5mm;color:#2f5d3a}
.qrbox{display:flex;align-items:center;gap:8mm;background:#fff8dc;border:1.2mm dashed #c99a2e;border-radius:5mm;padding:6mm 8mm}
.qr{width:62mm;height:62mm;shape-rendering:crispEdges}
.how{font-size:6.2mm;line-height:1.55;margin:0}
.how b{color:#b33a2a}
.note{font-size:4.2mm;color:#555;text-align:center;margin:0;line-height:1.6}
.shop{margin-top:auto;font-size:5.2mm;text-align:center;border-top:.6mm solid #2f5d3a;padding-top:3mm;width:100%}
.print{position:fixed;right:16px;bottom:16px;font:inherit;font-size:16px;padding:10px 16px;border-radius:10px;border:0;background:#2f5d3a;color:#fff;cursor:pointer}
@media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}.print{display:none}}
@media screen and (max-width:820px){.sheet{transform:scale(.45);transform-origin:top left;margin:0}}
</style>
</head>

<div class="sheet">
  <img class="logo" src="logo.svg" alt="にしおさんぽGO"/>
