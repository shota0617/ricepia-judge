<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>西尾の四季ドット絵｜にしおさんぽGO</title>
<meta name="description" content="愛知県西尾市の名所を、春夏秋冬・朝昼夕夜・4つの向きで描いた特大ドット絵のギャラリー。お散歩ゲーム「にしおさんぽGO」から。画像は保存して、西尾の紹介に使えます。"/>
<meta name="theme-color" content="#2f5d3a"/>
<link rel="canonical" href="https://go.ricepia.jp/nishio-go/pr.html"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="西尾の四季ドット絵｜にしおさんぽGO"/>
<meta property="og:description" content="西尾市の名所を、春夏秋冬・朝昼夕夜で描いたドット絵。"/>
<meta property="og:url" content="https://go.ricepia.jp/nishio-go/pr.html"/>
<meta property="og:image" content="https://go.ricepia.jp/nishio-go/ogp.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<style>
  :root { --green: #2f5d3a; --ink: #1f2a22; --sub: #5d6b60; --bg: #f6f4ec; --card: #fff; --line: #e3e0d3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  header { background: var(--green); color: #fff; padding: 14px 16px; }
  header a { color: #fff; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .lead { color: var(--sub); margin: 0 0 12px; font-size: 15px; }
  .count { display: inline-block; font-weight: 700; color: #1f5a25; background: #eaf6e2; border-radius: 8px; padding: 4px 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .bar button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; font: inherit; }
  .art { display: block; width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; }
  .tile b { display: block; font-size: 14px; padding: 6px 10px 0; }
  .tile small { display: block; font-size: 12px; color: var(--sub); padding: 0 10px 8px; }
  .t0 { background: linear-gradient(#9fd0f0, #cfe6f2 60%, #f8d8b0); }
  .t1 { background: linear-gradient(#5fb0ea, #8cc8f0 60%, #c4e6f8); }
  .t2 { background: linear-gradient(#4a3e7e, #c86a6a 60%, #f6b46a); }
  .t3 { background: linear-gradient(#0a1230, #16224a 60%, #26386a); }
  dialog { border: 0; border-radius: 16px; padding: 0; max-width: min(560px, calc(100vw - 32px)); width: 100%; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .big { padding: 16px; }
  .big h2 { margin: 0 0 2px; font-size: 20px; }
  .big .desc { color: var(--sub); font-size: 14px; margin: 0 0 8px; }
  .big .art { border-radius: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  .row span { font-size: 13px; color: var(--sub); min-width: 4em; }
  .row button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  .row button[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .acts a, .acts button { flex: 1; text-align: center; background: var(--green); color: #fff; border: 0; border-radius: 10px; padding: 10px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .acts .sub { background: #eee; color: var(--ink); }
  .note { color: var(--sub); font-size: 13px; }
  a { color: #1d5fb8; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header><a href="../nishio-go.html">← にしおさんぽGO</a></header>
<main>
  <h1>西尾の四季ドット絵</h1>
  <p class="lead">愛知県西尾市の名所を、春夏秋冬・朝昼夕夜・4つの向きで描いた特大ドット絵です。絵をえらぶと大きく見られて、画像を保存できます。西尾の紹介に、どうぞ使ってください。</p>
  <p><span class="count" id="count">読みこみ中…</span></p>
  <div class="bar" id="areaBar" aria-label="地区"></div>
  <div class="bar" id="seasonBar" aria-label="季節"></div>
  <div class="bar" id="timeBar" aria-label="時間帯"></div>
  <div class="grid" id="grid"></div>
  <p class="note">絵は、お散歩ゲーム「にしおさんぽGO」の歩く地図の特大の絵と同じ形を、Blender で立体にして向きを変えて描き、季節と時間帯の色をのせたものです。名所の説明は ゲームの名所の窓と同じ文です。
    つくったのは 西尾のお米屋さん <a href="https://ricepia.jp/?utm_source=nishio-go&amp;utm_medium=pr&amp;utm_campaign=pr_gallery" target="_blank" rel="noopener">近藤米穀店・らいすぴあ</a>。</p>
  <a class="acts" href="../nishio-go.html" style="display:block;text-align:center;background:var(--green);color:#fff;font-weight:700;border-radius:14px;padding:14px;text-decoration:none">にしおさんぽGO で 西尾を歩く</a>
</main>
<dialog id="dlg"><div class="big">
  <h2 id="bName"></h2><p class="desc" id="bDesc"></p>
  <img class="art" id="bArt" alt="" width="96" height="96"/>
  <div class="row" id="bSeason"><span>季節</span></div>
  <div class="row" id="bTime"><span>時間帯</span></div>
  <div class="row" id="bView"><span>向き</span></div>
  <div class="acts"><button type="button" id="bSave">画像を保存</button><button type="button" class="sub" id="bLink">リンクをコピー</button><button type="button" class="sub" id="bClose">とじる</button></div>
</div></dialog>
<script>
(() => {
  const AREA = { '': 'ぜんぶ', nishio: '西尾', isshiki: '一色', kira: '吉良', hazu: '幡豆', sakushima: '佐久島' };
  const SEASON = ['春', '夏', '秋', '冬'], TIME = ['朝', '昼', '夕方', '夜'], VIEW = ['左前', '右前', '高い所', 'うしろ'];
  const SKY = [['#9fd0f0', '#cfe6f2', '#f8d8b0'], ['#5fb0ea', '#8cc8f0', '#c4e6f8'], ['#4a3e7e', '#c86a6a', '#f6b46a'], ['#0a1230', '#16224a', '#26386a']];
  const $ = id => document.getElementById(id);
  const jst = new Date(Date.now() + 9 * 3600000), mo = jst.getUTCMonth() + 1, hr = jst.getUTCHours();
  const st = { area: '', s: mo >= 3 && mo <= 5 ? 0 : mo <= 8 && mo >= 6 ? 1 : mo >= 9 && mo <= 11 ? 2 : 3, t: hr >= 5 && hr < 10 ? 0 : hr < 16 && hr >= 10 ? 1 : hr >= 16 && hr < 19 ? 2 : 3 };
  let items = [], cur = null;
  const src = (id, v, s, t) => `art/pr/${id}/${v}-${s}-${t}.png`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function bar(el, labels, key) {
    el.innerHTML = labels.map((l, i) => `<button type="button" data-v="${Array.isArray(labels) ? i : l}">${esc(Array.isArray(labels) ? l : AREA[l])}</button>`).join('');
    const sync = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(st[key]))));
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st[key] = key === 'area' ? b.dataset.v : +b.dataset.v; sync(); draw(); });
    sync();
  }
  function draw() {
    $('grid').innerHTML = items.filter(x => !st.area || x.area === st.area).map(x => `<button type="button" class="tile" data-id="${esc(x.id)}">
      <img class="art t${st.t}" src="${src(x.id, x.views[0], st.s, st.t)}" alt="${esc(x.name)}（${SEASON[st.s]}・${TIME[st.t]}）" width="96" height="96" loading="lazy"/>
      <b>${esc(x.name)}</b><small>${esc(AREA[x.area] || '')}・${x.views.length * 16}枚</small></button>`).join('');
  }
  function open(x, v = x.views[0], s = st.s, t = st.t) {
    cur = { x, v, s, t };
    $('bName').textContent = x.name; $('bDesc').textContent = x.desc || '';
    const row = (el, labels, key, ok = () => true) => {
      el.innerHTML = `<span>${el.firstElementChild ? el.firstElementChild.textContent : ''}</span>` + labels.map((l, i) => ok(i) ? `<button type="button" data-v="${i}" aria-pressed="${cur[key] === i}">${l}</button>` : '').join('');
      el.onclick = e => { const b = e.target.closest('button'); if (!b) return; cur[key] = +b.dataset.v; show(); };
    };
    const show = () => {
      $('bArt').src = src(x.id, cur.v, cur.s, cur.t); $('bArt').className = `art t${cur.t}`; $('bArt').alt = `${x.name}（${SEASON[cur.s]}・${TIME[cur.t]}・${VIEW[cur.v]}から）`;
      row($('bSeason'), SEASON, 's'); row($('bTime'), TIME, 't'); row($('bView'), VIEW, 'v', i => x.views.includes(i));
      history.replaceState(null, '', `#${x.id}/${cur.v}-${cur.s}-${cur.t}`);
    };
    show();
    if (!$('dlg').open) $('dlg').showModal();
  }
  function save() {   // 1080×1080：空の色の上に絵を9倍で、下に名前
    const { x, v, s, t } = cur, img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d'), sky = g.createLinearGradient(0, 0, 0, 1080);
      SKY[t].forEach((col, i) => sky.addColorStop(i / 2, col));
      g.fillStyle = sky; g.fillRect(0, 0, 1080, 1080);
      g.imageSmoothingEnabled = false; g.drawImage(img, 108, 40, 864, 864);
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 920, 1080, 160);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = 'bold 54px system-ui, sans-serif'; g.fillText(x.name, 540, 990);
      g.font = '30px system-ui, sans-serif'; g.fillText(`愛知県西尾市・${SEASON[s]}の${TIME[t]}　にしおさんぽGO`, 540, 1046);
      const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `nishio-${x.id.replace(/^f-/, '')}-${v}${s}${t}.png`; a.click();
    };
    img.src = src(x.id, v, s, t);
  }
  $('bSave').onclick = save;
  $('bClose').onclick = () => { $('dlg').close(); history.replaceState(null, '', location.pathname); };
  $('bLink').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('bLink').textContent = 'コピーしました'; setTimeout(() => { $('bLink').textContent = 'リンクをコピー'; }, 1500); } catch (e) { /* noop */ } };
  $('grid').addEventListener('click', e => { const b = e.target.closest('.tile'); const x = b && items.find(i => i.id === b.dataset.id); if (x) open(x); });
  fetch('art/pr/list.json').then(r => r.json()).then(j => {
    items = j.items;
    $('count').textContent = `${items.length}か所・全${j.count}枚`;
    bar($('areaBar'), Object.keys(AREA), 'area'); bar($('seasonBar'), SEASON, 's'); bar($('timeBar'), TIME, 't');
    draw();
    const m = location.hash.match(/^#([\w-]+)\/(\d)-(\d)-(\d)$/), x = m && items.find(i => i.id === m[1]);
    if (x) open(x, +m[2], +m[3], +m[4]);
  }).catch(() => { $('count').textContent = '絵の一覧を読みこめませんでした'; });
})();
</script>
</body>
</html>
