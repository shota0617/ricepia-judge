<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>らいすぴあ つなぐ</title>
<meta name="description" content="らいすぴあの店舗どうしをビデオ通話でつなぐページ。開くだけで、最大5台がひとつの部屋に入ります。"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#1c1c14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="つなぐ"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1c1c14;color:#f5f2eb;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;}
button{font-family:inherit;cursor:pointer;}
[hidden]{display:none !important;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes spin{to{transform:rotate(360deg);}}

#call{position:fixed;inset:0;display:flex;flex-direction:column;}
#stage{position:relative;flex:1;min-height:0;background:#111;}
/* one remote device per screen; swipe sideways to switch */
#grid{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;}
#grid::-webkit-scrollbar{display:none;}
#grid video{flex:0 0 100%;width:100%;height:100%;object-fit:contain;background:#111;scroll-snap-align:center;scroll-snap-stop:always;}
#pager{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:16px;z-index:2;font-size:12px;}
#pager button{width:11px;height:11px;border-radius:50%;border:none;background:rgba(255,255,255,.4);padding:0;}
#pager button.on{background:#fff;}
#self{position:absolute;right:12px;bottom:12px;width:min(28vw,220px);aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid #3d3d2e;background:#2b2b20;transform:scaleX(-1);z-index:2;}
#self.off{visibility:hidden;}
#top{position:absolute;left:0;right:0;top:0;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:14px;z-index:3;}
.dot{width:10px;height:10px;border-radius:50%;background:#9a9a7a;display:inline-block;}
.dot.on{background:#7cc48e;} .dot.wait{background:#e0b050;animation:pulse 1.4s infinite;}
#topR{margin-left:auto;display:flex;align-items:center;gap:12px;}
#recDot{width:10px;height:10px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.25);animation:pulse 1.6s infinite;}
#restartBtn{background:rgba(0,0,0,.35);border:none;color:#fff;font-size:12px;height:38px;padding:0 12px;border-radius:19px;white-space:nowrap;}
#gear{background:rgba(0,0,0,.35);border:none;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;}
#waiting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:1;}
#waiting .msg{font-size:20px;font-weight:700;line-height:1.6;}
#waiting .sub{font-size:13px;color:#bdbda0;line-height:1.8;}
.spinner{width:34px;height:34px;border:3px solid #c8a96e;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;}
.big{display:block;border:none;border-radius:12px;font-size:16px;font-weight:700;padding:13px 20px;}
#zoomHint{background:#2d8cff;color:#fff;}
#entry{position:fixed;inset:0;z-index:15;background:rgba(20,20,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;}
#entry .q{font-size:20px;font-weight:700;margin-bottom:6px;}
#entry .big{width:min(100%,360px);font-size:18px;padding:18px;}
#entry .on{background:#3f7050;color:#fff;} #entry .mute{background:#3d3d2e;color:#fff;border:1.5px solid #6a6a54;}
#muteTag{background:#c94c4c;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}
#tapAudio{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#c8a96e;color:#2d2d1e;z-index:4;}
#bar{display:flex;justify-content:center;gap:14px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#24241a;}
.cb{width:64px;height:64px;border-radius:50%;border:none;background:#3d3d2e;color:#fff;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.cb small{font-size:9px;margin-top:2px;}
.cb.off{background:#c94c4c;} .cb.end{background:#c94c4c;} .cb.go{background:#3f7050;} .cb.zoom{background:#2d8cff;}
#sheet,#pass{position:fixed;inset:0;background:rgba(20,20,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;}
.box{background:#fff;color:#2d2d1e;border-radius:16px;padding:22px 20px;max-width:440px;width:100%;}
.box h1{font-size:17px;margin-bottom:6px;}
.box label{display:block;font-size:12px;font-weight:700;color:#5a5a4a;margin:12px 0 4px;}
.box input{width:100%;padding:11px 12px;border:1.5px solid #c4bfaa;border-radius:9px;font-size:13px;background:#fafaf7;color:#2d2d1e;}
.box .hint{font-size:11px;color:#9a9a7a;line-height:1.7;margin-top:4px;}
.box .big{width:100%;margin-top:12px;}
.gold{background:#c8a96e;color:#2d2d1e;} .ghost{background:#fff;border:1.5px solid #c4bfaa !important;color:#5a5a4a;}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2d2d1e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;max-width:90vw;text-align:center;z-index:10;}
</style>
</head>
<body>

<div id="call">
  <div id="stage">
    <div id="grid"></div>
    <div id="pager" hidden></div>
    <div id="waiting"><div class="spinner"></div><div class="msg" id="waitMsg">準備中…</div><div class="sub" id="waitSub"></div><button class="big" id="zoomHint" hidden>つながらないときは Zoom で</button></div>
    <button class="big" id="tapAudio" hidden>🔊 タップして音を出す</button>
    <video id="self" autoplay playsinline muted></video>
    <div id="top"><span class="dot" id="dot"></span><span id="state"></span><span id="muteTag" hidden>🔇 ミュート中</span><span id="topR"><span id="recDot" title="録音・文字起こし中（ミーティングの「履歴」に保存）" hidden></span><button id="restartBtn" title="アプリを再起動">↻ 再起動</button><button id="gear" title="設定">⚙</button></span></div>
  </div>
  <div id="bar">
    <button class="cb" id="micBtn" title="マイク">🎤<small>マイク</small></button>
    <button class="cb" id="camBtn" title="カメラ">📷<small>カメラ</small></button>
    <button class="cb end" id="hangBtn" title="切る">✕<small>切る</small></button>
    <button class="cb zoom" id="zoomBtn" title="Zoomに切り替える">Z<small>Zoom</small></button>
  </div>
</div>
<div id="sheet" hidden>
  <div class="box">
    <h1>⚙ 設定</h1>
    <label for="zoomEdit">予備のZoomリンク</label>
    <input id="zoomEdit" inputmode="url" placeholder="空欄なら Zoom ID 544 001 0563" autocomplete="off"/>
    <div class="hint">空欄のときは らいすぴあのZoom（ID 544 001 0563）を開きます。Zoomの「招待リンクをコピー」で取れる pwd= 付きのリンクを入れると、パスコードの入力が要らなくなります（この端末にだけ保存）。</div>
    <button class="big gold" id="zoomSave">保存</button>
    <button class="big ghost" id="passReset">🔑 合言葉を入れなおす</button>
    <button class="big ghost" id="sheetClose">閉じる</button>
  </div>
</div>
<div id="pass" hidden>
  <div class="box">
    <h1>🔑 お店の合言葉</h1>
    <div class="hint">店内の端末どうしで、同じ合言葉を入れた端末だけがつながります。はじめに1回だけ入れてください（この端末に保存します。合言葉は店の外に出さないでください）。</div>
    <input id="passEdit" type="password" autocomplete="off" placeholder="合言葉（6文字以上）"/>
    <button class="big gold" id="passSave">保存してはじめる</button>
  </div>
</div>
<div id="entry" hidden>
  <div class="q">マイクはどうしますか？</div>
  <button class="big on" id="entryOn">🎤 マイクをオンで入る</button>
  <button class="big mute" id="entryMute">🔇 ミュートで入る</button>
  <div style="font-size:12px;color:#bdbda0;">入ったあとも、下の「マイク」ボタンでいつでも切り替えられます</div>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
/* らいすぴあ つなぐ — one shared room, up to 5 devices, nothing to set up.
   Each device takes the first free seat "<ROOM>-1…5" on the PeerJS server and calls the other seats;
   whoever opens later makes the calls, and both ends of a doubled call keep the one the lower seat started. */
const $ = s => document.querySelector(s);
// The room name comes from a passphrase typed once on each device (only its hash is kept, in localStorage).
// Devices with the same passphrase find each other; anyone who just opens this page can't guess the seats.
const SEATS = 5, PASS_LS = "ricepia_tsunagu_room";
let ROOM = "";
const seatId = n => ROOM + "-" + n;
const seatOf = id => { const s = String(id); return ROOM && s.startsWith(ROOM + "-") ? Number(s.slice(ROOM.length + 1)) || 0 : 0; }; // only our room's seats
function loadRoom(){ try{ const r = localStorage.getItem(PASS_LS); return /^ricepia-tsunagu-[0-9a-f]{24}$/.test(r || "") ? r : ""; }catch(e){ return ""; } }
async function roomOf(pass){
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ricepia-tsunagu:" + pass)));
  return "ricepia-tsunagu-" + [...h.slice(0, 12)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const DEFAULT_ZOOM = "https://zoom.us/j/5440010563"; // らいすぴあのZoom（パーソナルミーティングID 544 001 0563）
const LS = "ricepia_tsunagu_zoom";

const S = {seat:0, peer:null, local:null, calls:new Map(), streams:new Map(), data:new Map(), stopped:false, retryT:0, hintT:0, wake:null, toastT:0, zoom:""};

function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(S.toastT); S.toastT = setTimeout(() => t.hidden = true, ms || 3500);
}
function normZoom(u){ u = String(u || "").trim(); return /^https:\/\/([a-z0-9-]+\.)*zoom\.(us|com)\/[^\s<>"]*$/i.test(u) ? u : ""; }
function loadZoom(){ try{ return normZoom(localStorage.getItem(LS)) || DEFAULT_ZOOM; }catch(e){ return DEFAULT_ZOOM; } }

/* ---------- screen ---------- */
const others = () => Array.from(S.streams.keys());
function render(){
  const n = S.streams.size, grid = $("#grid");
  // keep video elements stable so playback isn't interrupted
  Array.from(grid.children).forEach(v => { if(!S.streams.has(v.dataset.id)) v.remove(); });
  S.streams.forEach((st, id) => {
    let v = grid.querySelector('video[data-id="' + CSS.escape(id) + '"]');
    if(!v){ v = document.createElement("video"); v.autoplay = true; v.playsInline = true; v.dataset.id = id; grid.appendChild(v); }
    if(v.srcObject !== st){ v.srcObject = st; v.play().then(() => $("#tapAudio").hidden = true).catch(() => $("#tapAudio").hidden = false); }
  });
  paintPager();
  if(n){
    $("#dot").className = "dot on";
    $("#state").textContent = (n + 1) + "台でつながっています";
    $("#waiting").hidden = true; clearTimeout(S.hintT); $("#zoomHint").hidden = true;
    keepAwake();
  } else if(!S.stopped && S.seat) waiting("ほかの端末がこのページを開くと、自動でつながります", "最大" + SEATS + "台まで入れます");
  recSync();
  capVideo();
}
/** Every device sends its video to each of the others, so lower the quality per connection as the room fills up
    (keeps a 5-device room within what a tablet and a shop's line can carry). */
function capVideo(){
  const n = S.streams.size, max = n <= 1 ? 1500000 : n === 2 ? 1000000 : n === 3 ? 700000 : 500000;
  S.calls.forEach(c => {
    const pc = c.peerConnection; if(!pc) return;
    pc.getSenders().forEach(sd => {
      if(!sd.track || sd.track.kind !== "video" || !sd.getParameters) return;
      const p = sd.getParameters();
      if(!p.encodings || !p.encodings.length) p.encodings = [{}];
      if(p.encodings[0].maxBitrate === max) return;
      p.encodings[0].maxBitrate = max;
      sd.setParameters(p).catch(() => {});
    });
  });
}
/* page dots: which device is on screen; tap a dot to jump */
const pageNow = () => { const g = $("#grid"); return g.clientWidth ? Math.round(g.scrollLeft / g.clientWidth) : 0; };
function paintPager(){
  const n = S.streams.size, pg = $("#pager");
  pg.hidden = n < 2;
  if(n < 2) return;
  const cur = Math.min(pageNow(), n - 1);
  if(pg.children.length !== n + 1){
    pg.innerHTML = Array.from({length:n}, (_, i) => `<button data-i="${i}" aria-label="${i + 1}台目"></button>`).join("") + '<span id="pagerTxt"></span>';
  }
  Array.from(pg.querySelectorAll("button")).forEach((b, i) => b.classList.toggle("on", i === cur));
  $("#pagerTxt").textContent = "← スワイプ →";
}
function goPage(i){ const g = $("#grid"); g.scrollTo({left:i * g.clientWidth, behavior:"smooth"}); }
function waiting(msg, sub, kind){
  kind = kind || "wait";
  $("#dot").className = "dot " + (kind === "wait" ? "wait" : "");
  $("#state").textContent = kind === "wait" ? "待っています" : "";
  $("#waiting").hidden = false;
  $("#waitMsg").textContent = msg || ""; $("#waitSub").textContent = sub || "";
  $(".spinner").hidden = kind !== "wait";
  clearTimeout(S.hintT); $("#zoomHint").hidden = true;
  S.hintT = setTimeout(() => { if(!S.streams.size) $("#zoomHint").hidden = false; }, kind === "wait" ? 30000 : 0);
}

/* ---------- media ---------- */
async function getMedia(){
  try{ return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}, video:{width:{ideal:1280}, height:{ideal:720}, facingMode:"user"}}); }
  catch(e){
    try{ const s = await navigator.mediaDevices.getUserMedia({audio:true}); toast("カメラが使えないため音声だけでつなぎます"); return s; }
    catch(e2){ return null; }
  }
}
function paintButtons(){
  const a = S.local && S.local.getAudioTracks()[0], v = S.local && S.local.getVideoTracks()[0];
  $("#micBtn").classList.toggle("off", !a || !a.enabled); $("#micBtn").innerHTML = (a && a.enabled ? "🎤" : "🔇") + "<small>マイク</small>";
  $("#muteTag").hidden = !a || a.enabled;
  $("#camBtn").classList.toggle("off", !v || !v.enabled);
  $("#self").classList.toggle("off", !v || !v.enabled);
}
function toggle(kind){
  const t = S.local && (kind === "audio" ? S.local.getAudioTracks()[0] : S.local.getVideoTracks()[0]);
  if(!t){ toast(kind === "audio" ? "マイクが使えません" : "カメラが使えません"); return; }
  t.enabled = !t.enabled; paintButtons();
  if(kind === "audio") sttSync();
}

/* ---------- room ---------- */
/** Ask "mic on or muted?" every time before entering (the tap also lets the browser play the others' sound). */
function entry(){
  $("#entry").hidden = false;
  waiting("", "", "off");
  clearTimeout(S.hintT); $("#zoomHint").hidden = true;
  $("#hangBtn").className = "cb go"; $("#hangBtn").innerHTML = "📞<small>つなぐ</small>";
  S.stopped = true;
}
function choose(muted){
  $("#entry").hidden = true;
  S.startMuted = muted;
  recAudioContext(); // created inside the tap so the browser lets it run
  join();
}
async function join(){
  S.stopped = false;
  $("#hangBtn").className = "cb end"; $("#hangBtn").innerHTML = "✕<small>切る</small>";
  waiting("準備中…");
  if(!window.Peer){ waiting("通話の部品を読み込めませんでした", "インターネット接続を確認して、ページを開き直してください", "off"); return; }
  if(!S.local){
    S.local = await getMedia();
    if(!S.local){ waiting("カメラとマイクが使えません", "ブラウザの設定でこのページのカメラ・マイクを「許可」にして、開き直してください", "off"); return; }
    $("#self").srcObject = S.local;
  }
  const mic = S.local.getAudioTracks()[0];
  if(mic) mic.enabled = !S.startMuted;
  paintButtons();
  takeSeat(1);
}
// Routes between devices: several STUN servers to find a direct path; PeerJS's TURN relay as the last resort.
const ICE = [
  {urls:["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478", "turn:us-0.turn.peerjs.com:3478"], username:"peerjs", credential:"peerjsp"}
];
/** Keep trying to get back to the signalling server. The video/audio between devices doesn't go through it,
    so the calls carry on meanwhile; only new joins have to wait. */
function keepSignal(p){
  clearTimeout(S.sigT);
  if(S.stopped || p.destroyed || S.peer !== p || !p.disconnected) return;
  try{ p.reconnect(); }catch(e){}
  S.sigT = setTimeout(() => keepSignal(p), 4000);
}
/** Register the first free seat; a taken seat answers "unavailable-id", so try the next one. */
function takeSeat(n){
  if(S.stopped || !ROOM) return; // no passphrase yet: never take a seat in an empty room
  if(n > SEATS){
    waiting("満室です（" + SEATS + "台まで）", "ほかの端末が1台閉じると、自動で入ります", "wait");
    clearTimeout(S.retryT); S.retryT = setTimeout(() => takeSeat(1), 8000); return;
  }
  const p = new Peer(seatId(n), {debug:0, config:{iceServers:ICE}});
  let opened = false;
  p.on("open", () => {
    if(opened){ callAll(); return; } // back after a signalling reconnect: calls kept running, just re-check
    opened = true; S.peer = p; S.seat = n; bind(p); render(); callAll(); });
  p.on("error", e => {
    if(opened) return;
    p.destroy();
    if(e.type === "unavailable-id") return takeSeat(n + 1);
    if(e.type === "browser-incompatible"){ waiting("このブラウザはビデオ通話に対応していません", "Chrome か Safari の最新版でお試しください", "off"); return; }
    waiting("インターネットにつながるのを待っています…", "回線が戻ると自動でつながります");
    clearTimeout(S.retryT); S.retryT = setTimeout(() => takeSeat(1), 5000);
  });
}
function bind(p){
  p.on("connection", c => { const s = seatOf(c.peer); if(S.stopped || !s || s > SEATS){ c.close(); return; } dataConn(c); });
  p.on("call", call => {
    const s = seatOf(call.peer);
    if(S.stopped || !s || s > SEATS || call.peer === p.id){ call.close(); return; } // only the room's seats
    const cur = S.calls.get(call.peer);
    // both sides called at once: keep the call the lower seat started
    // (but a call from a seat we think is already connected means that device restarted: take the new one)
    if(cur && cur._out && S.seat < s && !S.streams.has(call.peer)){ call.close(); return; }
    call.answer(S.local); use(call);
  });
  p.on("disconnected", () => { clearTimeout(S.sigT); S.sigT = setTimeout(() => keepSignal(p), 1000); });
  p.on("error", e => {
    if(e.type === "peer-unavailable"){
      // that seat is empty: drop our unanswered call so a later call from it can come in
      const id = ROOM && (String(e.message).match(new RegExp(ROOM + "-\\d+")) || [])[0]; // our room's seat id in the message (the room name is letters, digits and "-" only)
      const c = id && S.calls.get(id);
      if(c && c._out && !S.streams.has(id)){ S.calls.delete(id); try{ c.close(); }catch(x){} }
      return;
    }
    if(e.type === "unavailable-id"){
      // while we were away from the server our seat was given to another device: take a free one
      leaveSeat(); clearTimeout(S.retryT); S.retryT = setTimeout(() => takeSeat(1), 1000);
      return;
    }
    if(e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed"){
      if(!S.streams.size) waiting("インターネットにつながるのを待っています…", "回線が戻ると自動でつながります");
      if(p.destroyed){ leaveSeat(); clearTimeout(S.retryT); S.retryT = setTimeout(() => takeSeat(1), 5000); }
      else { clearTimeout(S.sigT); S.sigT = setTimeout(() => keepSignal(p), 2000); } // calls keep running
    }
  });
}
function callAll(){
  clearTimeout(S.retryT);
  if(S.stopped || !S.peer || !S.peer.open) return;
  for(let n = 1; n <= SEATS; n++){
    const id = seatId(n);
    if(n === S.seat || S.streams.has(id) || S.calls.has(id)) continue;
    const c = S.peer.call(id, S.local);
    if(c){ c._out = true; use(c); }
  }
  // a text channel to each seat, for sharing the transcript
  for(let n = 1; n <= SEATS; n++){
    const id = seatId(n);
    if(n !== S.seat && !S.data.has(id)) dataConn(S.peer.connect(id, {reliable:true}));
  }
  // catch a device that opened while our calls were in flight (or a sleeping tablet that woke up)
  S.retryT = setTimeout(callAll, 15000);
}
function use(c){
  const id = c.peer, old = S.calls.get(id);
  if(old && old !== c){ S.calls.delete(id); try{ old.close(); }catch(e){} }
  S.calls.set(id, c);
  c.on("stream", st => {
    if(S.calls.get(id) !== c) return;
    const isNew = !S.streams.has(id);
    S.streams.set(id, st); render();
    if(isNew) chime();
  });
  c.on("close", () => {
    if(S.calls.get(id) !== c) return;
    S.calls.delete(id);
    if(S.streams.delete(id) && !S.stopped) toast("1台が抜けました");
    // call back soon (if it was a dropped line rather than the device leaving, this reconnects it)
    if(!S.stopped){ clearTimeout(S.retryT); S.retryT = setTimeout(callAll, 2000 + Math.random() * 2000); }
    render();
  });
  c.on("error", () => {});
  const pc = c.peerConnection; // ICE failure (Wi-Fi switched etc.): treat as closed
  if(pc){
    pc.addEventListener("connectionstatechange", () => { if(pc.connectionState === "failed" && S.calls.get(id) === c) c.close(); });
    // "disconnected" can linger without ever turning "failed" (seen on iPad after a Wi-Fi switch): give it 8s, then redial
    let discT = 0;
    pc.addEventListener("iceconnectionstatechange", () => {
      clearTimeout(discT);
      if(pc.iceConnectionState === "disconnected") discT = setTimeout(() => {
        if(S.calls.get(id) === c && /disconnected|failed/.test(pc.iceConnectionState)) c.close();
      }, 8000);
    });
  }
}
function leaveSeat(){
  S.calls.forEach(c => { try{ c.close(); }catch(e){} }); S.calls.clear(); S.streams.clear();
  S.data.forEach(c => { try{ c.close(); }catch(e){} }); S.data.clear();
  try{ S.peer && S.peer.destroy(); }catch(e){} S.peer = null; S.seat = 0;
  render();
}
function hangUp(){
  if(S.stopped){ entry(); return; }
  S.stopped = true; clearTimeout(S.retryT);
  leaveSeat();
  if(S.local){ S.local.getTracks().forEach(t => t.stop()); S.local = null; $("#self").srcObject = null; }
  if(S.wake){ S.wake.release().catch(() => {}); S.wake = null; }
  waiting("通話を切りました", "もう一度つなぐときは下の「つなぐ」を押してください", "off");
  $("#hangBtn").className = "cb go"; $("#hangBtn").innerHTML = "📞<small>つなぐ</small>";
}

/* ---------- 記録：録音＋文字起こし（つながっている間は自動。ミーティングの「履歴」に保存） ----------
   Stored exactly like meeting.html does (localStorage "rmt_meetings", IndexedDB "rmt_audio"), so the records
   show up in ミーティング → 履歴 / 要望分析, and an interrupted recording is stitched back there.
   Every device keeps its own complete record: it records everyone's mixed audio, transcribes its own voice
   and shares those lines with the others over a data channel. A record is split every hour. */
const REC_KEY = "rmt_meetings", SEGMENT_MS = 60 * 60 * 1000, AUDIO_DAYS = 7, TEXT_DAYS = 60;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const R = {rec:null, ac:null, dest:null, srcs:new Map(), mr:null, mime:"", chunks:[], pending:[], part:0, flushT:0, segT:0, saveT:0,
  sr:null, srRun:false, srFails:0, seq:0};
const devName = n => "端末" + n;
const pad2 = n => String(n).padStart(2, "0");

function loadRecs(){ try{ return JSON.parse(localStorage.getItem(REC_KEY)) || []; }catch(e){ return []; } }
let quotaWarned = 0;
function saveRec(rec){
  const list = loadRecs(), i = list.findIndex(m => m.id === rec.id);
  if(i >= 0) list[i] = rec; else list.unshift(rec);
  try{ localStorage.setItem(REC_KEY, JSON.stringify(list.slice(0, 200))); return true; }
  catch(e){ if(Date.now() - quotaWarned > 60000){ quotaWarned = Date.now(); toast("記録を保存できません（端末の容量不足）。ミーティングの「履歴」で古い記録を消してください", 6000); } return false; }
}
const saveSoon = () => { clearTimeout(R.saveT); R.saveT = setTimeout(() => R.rec && saveRec(R.rec), 800); };

/* IndexedDB (same database as meeting.html) */
let dbp = null;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open("rmt_audio", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("audio");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idb = (fn) => db().then(d => new Promise((res, rej) => { const t = d.transaction("audio", "readwrite"); fn(t.objectStore("audio")); t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); })).catch(() => {});
const audioPut = (k, v) => idb(st => st.put(v, k));
const audioDel = id => idb(st => { st.delete(id); st.delete(IDBKeyRange.bound(id + ":", id + ":\uffff")); });

function recAudioContext(){
  try{ if(!R.ac) R.ac = new (window.AudioContext || window.webkitAudioContext)(); R.ac.resume().catch(() => {}); }catch(e){}
}
function mixIn(key, stream){
  if(!R.mr || !R.dest || R.srcs.has(key) || !stream || !stream.getAudioTracks().length) return;
  try{ const src = R.ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks())); src.connect(R.dest); R.srcs.set(key, src); }catch(e){}
}
function flushParts(){
  if(!R.pending.length || !R.rec) return;
  const blob = new Blob(R.pending, {type:R.mime}); R.pending = [];
  audioPut(R.rec.id + ":part:" + String(R.part++).padStart(6, "0"), blob);
}
/** keep the record in step with the room: start when someone is connected, stop when nobody is */
function recSync(){
  const on = S.streams.size > 0 && !S.stopped;
  if(on && !R.rec) recStart();
  else if(!on && R.rec) recStop();
  if(R.rec){ S.streams.forEach((st, id) => mixIn(id, st)); R.rec.participants["s" + S.seat] = {name:devName(S.seat), role:""}; S.streams.forEach((st, id) => { R.rec.participants["s" + seatOf(id)] = {name:devName(seatOf(id)), role:""}; }); }
  $("#recDot").hidden = !R.rec;
}
function recStart(){
  const now = Date.now(), d = new Date(now);
  R.rec = {id:"m_tsunagu_" + now + "_" + S.seat, code:"", source:"tsunagu", role:"host",
    title:"つなぐ " + (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()),
    customer:"", startedAt:now, endedAt:null, participants:{}, lines:[], chat:[], notes:"", analysis:null};
  saveRec(R.rec);
  // audio: everyone's voices mixed
  try{
    recAudioContext();
    R.dest = R.ac.createMediaStreamDestination();
    R.mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
    R.mr = new MediaRecorder(R.dest.stream, Object.assign({audioBitsPerSecond:32000}, R.mime ? {mimeType:R.mime} : {}));
    R.mime = R.mr.mimeType || R.mime || "audio/webm";
    R.chunks = []; R.pending = []; R.part = 0; R.srcs.clear();
    R.mr.ondataavailable = e => { if(e.data && e.data.size){ R.chunks.push(e.data); R.pending.push(e.data); } };
    R.audioStart = now;
    audioPut(R.rec.id + ":meta", {startedAt:now, mime:R.mime});
    R.mr.start(1000);
    const mic = S.local && S.local.getAudioTracks()[0];
    if(mic) mixIn("me", new MediaStream([mic]));
    clearInterval(R.flushT); R.flushT = setInterval(flushParts, 10000);
  }catch(e){ R.mr = null; }
  clearInterval(R.segT); R.segT = setInterval(() => { if(R.rec && Date.now() - R.rec.startedAt > SEGMENT_MS){ recStop(); recSync(); } }, 60000);
  sttSync();
}
/** Returns a promise that resolves once the recording and transcript are saved. */
function recStop(){
  const rec = R.rec, mr = R.mr, chunks = R.chunks, mime = R.mime, start = R.audioStart;
  R.rec = null; R.mr = null; R.chunks = []; R.pending = [];
  clearInterval(R.flushT); clearInterval(R.segT); clearTimeout(R.saveT);
  sttSync();
  rec.endedAt = Date.now();
  const finish = async () => {
    R.srcs.forEach(s => { try{ s.disconnect(); }catch(e){} }); R.srcs.clear();
    const blob = new Blob(chunks, {type:mime});
    if(blob.size > 2000){
      await audioDel(rec.id); await audioPut(rec.id, blob);
      rec.audio = {startedAt:start, mime, size:blob.size, sec:Math.round((rec.endedAt - start) / 1000), timing:"end"};
    } else await audioDel(rec.id);
    if(rec.lines.length || rec.audio) saveRec(rec);
    else { const list = loadRecs().filter(m => m.id !== rec.id); try{ localStorage.setItem(REC_KEY, JSON.stringify(list)); }catch(e){} }
  };
  $("#recDot").hidden = true;
  return new Promise(res => {
    const done = () => finish().then(res, res);
    if(mr && mr.state !== "inactive"){ mr.onstop = done; try{ mr.stop(); }catch(e){ done(); } } else done();
  });
}

/* ---------- restart ---------- */
// The home-screen app has no reload button: this one saves the recording, frees the seat and reopens the latest page.
async function restartApp(){
  if(!confirm("アプリを再起動します（つながっている場合は一度切れて、すぐにつなぎ直せます）。よろしいですか？")) return;
  const btn = $("#restartBtn"); btn.disabled = true; btn.textContent = "再起動中…";
  try{ if(R.rec) await Promise.race([recStop(), new Promise(r => setTimeout(r, 4000))]); }catch(e){}
  try{ S.calls.forEach(c => c.close()); S.data.forEach(c => c.close()); S.peer && S.peer.destroy(); }catch(e){}
  if(S.local) S.local.getTracks().forEach(t => t.stop());
  location.replace(location.pathname + "?r=" + Date.now()); // a fresh URL so a cached old version isn't reused
}
function recPagehide(){
  if(!R.rec) return;
  try{ if(R.mr) R.mr.requestData(); }catch(e){}
  flushParts(); // the pieces already saved are stitched together the next time ミーティング is opened
  R.rec.endedAt = Date.now(); saveRec(R.rec);
}
/** Old records are trimmed so a tablet left connected all day doesn't fill up. */
function recCleanup(){
  const now = Date.now(), list = loadRecs(); let changed = false;
  const keep = list.filter(m => {
    if(m.source !== "tsunagu") return true;
    if(now - m.startedAt > TEXT_DAYS * 864e5){ audioDel(m.id); changed = true; return false; }
    if(m.audio && now - m.startedAt > AUDIO_DAYS * 864e5){ audioDel(m.id); m.audio = null; changed = true; }
    return true;
  });
  if(changed) try{ localStorage.setItem(REC_KEY, JSON.stringify(keep)); }catch(e){}
}

/* transcript lines: my own voice (speech recognition) + lines sent by the other devices */
function addLine(l){
  if(!R.rec || !l.text || R.rec.lines.some(x => x.id === l.id)) return;
  R.rec.lines.push(l); saveSoon();
}
function dataConn(c){
  if(!c) return;
  c.on("open", () => { const old = S.data.get(c.peer); if(old && old !== c && old.open) return; S.data.set(c.peer, c); });
  c.on("data", d => {
    if(!d || d.t !== "line" || !R.rec) return;
    const n = seatOf(c.peer);
    addLine({id:c.peer + "-" + String(d.id || "").slice(-40), at:Date.now(), who:devName(n), role:"", pid:c.peer, text:String(d.text || "").slice(0, 2000)});
  });
  c.on("close", () => { if(S.data.get(c.peer) === c) S.data.delete(c.peer); });
  c.on("error", () => {});
}
function sttSync(){
  const mic = S.local && S.local.getAudioTracks()[0];
  const want = !!(SR && R.rec && mic && mic.enabled && !S.stopped);
  if(want && !R.srRun) sttRun();
  if(!want && R.sr){ const r = R.sr; R.sr = null; R.srRun = false; r.onend = null; try{ r.stop(); }catch(e){} }
}
function sttRun(){
  const r = new SR();
  r.lang = "ja-JP"; r.continuous = true; r.interimResults = false;
  r.onresult = e => {
    R.srFails = 0;
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i], text = (res[0] && res[0].transcript || "").trim();
      if(!res.isFinal || !text) continue;
      const id = "l" + (++R.seq) + "-" + Date.now().toString(36);
      addLine({id:seatId(S.seat) + "-" + id, at:Date.now(), who:devName(S.seat), role:"", pid:seatId(S.seat), text});
      S.data.forEach(c => { try{ if(c.open) c.send({t:"line", id, text}); }catch(x){} });
    }
  };
  r.onerror = e => {
    // silence ("no-speech") just restarts; only real failures count toward giving up
    if(e.error === "network" || e.error === "audio-capture") R.srFails++;
    if(e.error === "not-allowed" || e.error === "service-not-allowed" || R.srFails >= 4){
      R.srGaveUp = true; toast("この端末では文字起こしができませんでした（録音は続けます）", 5000);
    }
  };
  r.onend = () => { R.srRun = false; if(R.sr === r && !R.srGaveUp) setTimeout(sttSync, R.srFails ? 1500 * R.srFails : 300); };
  try{ r.start(); R.sr = r; R.srRun = true; }catch(e){ R.srRun = false; }
}

/* ---------- Zoom backup ---------- */
// The camera and mic can't serve two calls well at once, so this call is ended before Zoom opens.
function goZoom(){
  if(!confirm("Zoomに切り替えます。この画面の通話は切ります（あとで「つなぐ」で戻れます）。")) return;
  if(!S.stopped) hangUp();
  const w = window.open(S.zoom, "_blank");
  if(w) w.opener = null; else location.href = S.zoom;
}

function chime(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)(), g = ac.createGain(); g.connect(ac.destination);
    [880, 1320].forEach((f, i) => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(g); o.start(ac.currentTime + i * .18); o.stop(ac.currentTime + i * .18 + .15); });
    g.gain.value = .08; setTimeout(() => ac.close(), 800);
  }catch(e){}
}
async function keepAwake(){
  try{ if("wakeLock" in navigator && !S.wake && document.visibilityState === "visible"){ S.wake = await navigator.wakeLock.request("screen"); S.wake.addEventListener("release", () => S.wake = null); } }catch(e){}
}

$("#micBtn").onclick = () => toggle("audio");
$("#camBtn").onclick = () => toggle("video");
$("#hangBtn").onclick = hangUp;
$("#zoomBtn").onclick = goZoom;
$("#zoomHint").onclick = goZoom;
$("#pager").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if(b) goPage(+b.dataset.i); });
// remember which device is on screen, so rotating the tablet keeps it there
let pagerRaf = 0, lastPage = 0, resizing = false;
$("#grid").addEventListener("scroll", () => {
  if(!pagerRaf) pagerRaf = requestAnimationFrame(() => { pagerRaf = 0; if(!resizing) lastPage = pageNow(); paintPager(); });
}, {passive:true});
window.addEventListener("resize", () => {
  resizing = true; const g = $("#grid"); g.scrollLeft = lastPage * g.clientWidth;
  setTimeout(() => { resizing = false; paintPager(); }, 150);
});
$("#tapAudio").onclick = () => { document.querySelectorAll("#grid video").forEach(v => v.play().catch(() => {})); $("#tapAudio").hidden = true; };
$("#restartBtn").onclick = restartApp;
$("#gear").onclick = () => { $("#zoomEdit").value = S.zoom === DEFAULT_ZOOM ? "" : S.zoom; $("#sheet").hidden = false; };
$("#sheetClose").onclick = () => $("#sheet").hidden = true;
$("#zoomSave").onclick = () => {
  const raw = $("#zoomEdit").value.trim(), z = normZoom(raw);
  if(raw && !z){ toast("Zoomのリンクは https://…zoom.us/j/… の形で入れてください"); return; }
  try{ if(z) localStorage.setItem(LS, z); else localStorage.removeItem(LS); }catch(e){}
  S.zoom = z || DEFAULT_ZOOM; $("#sheet").hidden = true;
  toast(z ? "Zoomリンクを保存しました" : "標準のZoom（ID 544 001 0563）を使います");
};
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || S.stopped) return;
  if(S.streams.size) keepAwake();
  if(!S.peer || S.peer.destroyed){ if(!S.seat) takeSeat(1); } else callAll(); // tablet woke up
});
window.addEventListener("online", () => { if(!S.stopped && (!S.peer || S.peer.destroyed)) takeSeat(1); });
// closing the page frees our seat right away and tells the others
window.addEventListener("pagehide", () => { recPagehide(); try{ S.calls.forEach(c => c.close()); S.peer && S.peer.destroy(); }catch(e){} });

recCleanup();
if(location.hash || location.search) history.replaceState(null, "", location.pathname); // old setup links (#k=…) and the restart marker (?r=…) are not needed
S.zoom = loadZoom();
$("#entryOn").onclick = () => choose(false);
$("#entryMute").onclick = () => choose(true);
$("#passSave").onclick = async () => {
  const v = $("#passEdit").value.trim();
  if(v.length < 6){ toast("合言葉は6文字以上にしてください"); return; }
  ROOM = await roomOf(v);
  try{ localStorage.setItem(PASS_LS, ROOM); }catch(e){}
  $("#passEdit").value = ""; $("#pass").hidden = true; entry();
};
$("#passReset").onclick = () => { try{ localStorage.removeItem(PASS_LS); }catch(e){} location.reload(); };
ROOM = loadRoom();
if(ROOM) entry(); else { $("#pass").hidden = false; waiting("", "", "off"); }
</script>
</body>
